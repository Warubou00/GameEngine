<style>

    --cs: #b391f5; --cpp: #59b7e8;
    --d-box: #1f242d; --d-head: #26324a; --d-line: #8792a5; --d-use: #5d6677; --d-ghost: #1a1d23; --d-text: #e3e7ee;

<!-- ======================================================================
     開発ガイド (手で書く。data-id がページの名前)

<template id="guides">

<article data-id="build" data-title="ビルドと実行 / テスト">
<h2>ビルドと実行 / テスト</h2>
<h3>何がどこにできるか</h3>
<ul>
  <li>C++ (<code>GameEngine.sln</code> : RHI / Renderer / Physics / Audio / Core) は <b>Visual Studio 2022 の MSBuild</b> で x64 の Debug / Release をビルドする。DLL と <code>Shader</code> フォルダは見本 (GameEngine_console) の出力の隣に置かれ、C# の exe はそこから DLL を読む</li>
  <li>C# の見本 <code>GameEngine_console</code> も VS の MSBuild でビルドする (COM の参照があるので <code>dotnet build</code> は失敗する)
<pre><code>"C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe" CSharp_console\GameEngine_console\GameEngine_console.csproj /p:Configuration=Release /p:Platform=x64</code></pre></li>
  <li>エディター / Player / ランチャーは <code>dotnet build</code> でよい。<b>必ず <code>-p:Platform=x64</code> を付ける</b> (付けないと <code>bin\Release</code> に出て、いつも動かしている <code>bin\x64\Release</code> が古いまま)
<pre><code>dotnet build CSharp_console\GameEngine.Editor\GameEngine.Editor.csproj -c Release -p:Platform=x64</code></pre></li>
  <li>エディターの作業フォルダは見本の出力フォルダ (シェーダーを <code>../Shader</code> から読む)。<code>RHI/Source/Shader</code> の .shader を変えたら、見本をビルドし直して写す (エディターは実行中に見張って読み直す)</li>
  <li>RHI のルートシグネチャ / ルートパラメーターを変えたら、RHI.dll を <b>Debug と Release の両方</b> ビルドし直す (古い DLL は PSO を作れない)</li>
</ul>
<h3>テスト</h3>
<table>
<tr><th>コマンド</th><th>中身</th></tr>
<tr><td class="sig">GameEngine.Editor.exe --editor-test</td><td>エディターの自動の確認 (<a href="#/t/GameEngine.Editor.EditorTest">EditorTest</a>)。置く / 元に戻す / 保存 / 再生 / プレハブ / 書き出し / 書き出したゲームとエディターの動きの比較 / シェーダー など。最後に <code>[Test] editor : pass N / fail M</code></td></tr>
<tr><td class="sig">GameEngine_console.exe --hierarchy-test</td><td>親子 (Hierarchy) の確認</td></tr>
<tr><td class="sig">GameEngine_console.exe --serialize-test</td><td>シーンの保存 / 読み込みの確認</td></tr>
<tr><td class="sig">GameEngine_console.exe --load-scene &lt;path&gt;</td><td>シーンを見本の exe で開く (性能の確認。F1 でプロファイラー、終わると <code>[Profiler] Summary</code> を出す)</td></tr>
</table>
<p>Debug の exe は D3D12 のデバッグレイヤー (検証) が有効。テストの出力に <code>D3D12 ERROR</code> / <code>WARNING</code> が 0 であることも確かめる。</p>
<h3>エディターの起動の引数</h3>
<pre><code>GameEngine.Editor.exe [--project &lt;folder&gt;] [--scene &lt;path&gt;] [--open-graph Assets/....shadergraph.json]
                      [--editor-test] [--resave-scenes] [--quit-after N]</code></pre>
</article>

<article data-id="ecs" data-title="コンポーネントと System を足す">
<h2>コンポーネントと System を足す (ECS)</h2>
<p>データは <a href="#/t/GameEngine.IComponent">IComponent</a> を付けた <b>struct</b>、処理は <a href="#/t/GameEngine.ISystem">ISystem</a> を実装したクラス。入れ物は <a href="#/t/GameEngine.World">World</a> (型ごとの <a href="#/t/GameEngine.ComponentPool%3C%3E">ComponentPool&lt;T&gt;</a>)。</p>
<pre><code>public struct Spin : IComponent
{
    [Range(0, 720), Tooltip("1 秒に回る角度")]
    public float DegreesPerSecond;
}

[GameSystem]                       // エディター / Player が見つけて登録する (Order で順番)
public sealed class SpinSystem : ISystem
{
    public void Update(World world)
    {
        var angle = Time.DeltaTime * MathEx.Deg2Rad;
        world.ForEach((Entity _, ref Transform transform, ref Spin spin) =&gt;
        {
            transform.Rotation = Quaternion.Normalize(transform.Rotation * Quaternion.CreateFromAxisAngle(Vector3.UnitY, spin.DegreesPerSecond * angle));
        });
    }
}</code></pre>
<ul>
  <li>保存とインスペクター : public のフィールドが自動で保存され、インスペクターに出る (<a href="#/t/GameEngine.ComponentRegistry">ComponentRegistry</a> がリフレクションで 1 回だけ調べる)。登録は要らない</li>
  <li>属性 : <a href="#/t/GameEngine.SerializeFieldAttribute">[SerializeField]</a> / <a href="#/t/GameEngine.HideInInspectorAttribute">[HideInInspector]</a> / <a href="#/t/GameEngine.RangeAttribute">[Range]</a> / <a href="#/t/GameEngine.TooltipAttribute">[Tooltip]</a> / <a href="#/t/GameEngine.HeaderAttribute">[Header]</a> / <a href="#/t/GameEngine.LayerAttribute">[Layer]</a> / <a href="#/t/GameEngine.ComponentInfoAttribute">[ComponentInfo]</a> (表示名 / 分類 / Hidden / DontSave)</li>
  <li>固定の刻み (物理の前) : <a href="#/t/GameEngine.IFixedSystem">IFixedSystem</a> の <code>FixedUpdate(World)</code>。剛体に力をかけるのはここ</li>
  <li>時間 : ゲームのコードは <a href="#/t/GameEngine.Time">Time</a>.<code>DeltaTime</code> / <code>PlayTime</code> (TotalTime はエディターの時間)</li>
  <li><code>ForEach</code> の中でエンティティ / コンポーネントを足したり消したりしない (配列の並びが変わる)。リストに集めて後で行う</li>
  <li>Entity は番号 (消して作り直すと変わる)。保存では <a href="#/t/GameEngine.EntityInfo">EntityInfo</a>.Id (GUID) で参照を書く</li>
  <li>毎フレームの順番 (<a href="#/t/GameEngine.Engine">Engine</a>) : 登録した System → Transform の行列 → カメラ → 描画へ反映 → ライト → パーティクル → 音 → 描画パイプライン</li>
</ul>
<div class="note">エンジンに組み込む System (Runtime の <code>Systems/</code>) は <code>Engine</code> のコンストラクターで並べる。ゲームのコード (Project/Scripts) はエディターが実行中にコンパイルして読み直す (<a href="#/t/GameEngine.Editor.ScriptHost">ScriptHost</a>)。</div>
</article>

<article data-id="render" data-title="描画パイプライン / 描画の命令を足す">
<h2>描画パイプライン / 描画の命令を足す</h2>
<p>1 フレームの描き方は C# で組み立てる (<a href="#/t/GameEngine.Rendering.RenderPipeline">RenderPipeline</a>。Unity の SRP に当たる)。<code>Render</code> は <a href="#/t/GameEngine.Rendering.RenderCommandBuffer">RenderCommandBuffer</a> に命令を<b>積むだけ</b>。エンジンが 1 フレーム分を 1 回の P/Invoke (<code>Renderer_Render</code>) で C++ に渡し、RHI の <code>CommandContext</code> が順に実行する。</p>
<ol class="steps">
  <li><b>C# : パイプライン</b><small><a href="#/t/GameEngine.Rendering.ForwardRenderPipeline">ForwardRenderPipeline</a> / <a href="#/t/GameEngine.Rendering.DeferredRenderPipeline">DeferredRenderPipeline</a> が例。Initialize でレンダーターゲット (<a href="#/t/GameEngine.Rendering.RenderTexture">RenderTexture</a>) と全画面のシェーダー (<a href="#/t/GameEngine.Rendering.FullscreenShader">FullscreenShader</a>.Load) を作る</small></li>
  <li><b>C# : 命令</b><small>SetRenderTarget(s) / ClearColor / ClearDepth / DrawScene / DrawFullscreen / UpdateParticles / DrawParticles / DrawCustom / SetCamera / SetViewport (v1.5)</small></li>
  <li><b>C++ : 実行</b><small>RHI/Source/DirectX12/RHIObject/CommandContext.cpp の <code>switch (RenderCommandType)</code></small></li>
</ol>
<h3>全画面のパス (ポストエフェクト) を足す</h3>
<pre><code>// Initialize
_blur = FullscreenShader.Load("../Shader/postProcess.shader", "PSBlur");
// Render
cmd.SetRenderTarget(_temp);
cmd.DrawFullscreen(_blur, stackalloc[] { hdr }, stackalloc[] { 1.0f / width, 0.0f });
// シェーダーでは g_Inputs[0].x がテクスチャの番号、g_Params が値</code></pre>
<h3>新しい命令の種類を足す</h3>
<ol class="steps">
  <li>RHI/Source/Public/rhiTypes.h の <a href="#/t/RHI%3A%3ARenderCommandType">RenderCommandType</a> に値を足す (Arg0 / Arg1 / Inputs / Params の意味をコメントに書く)</li>
  <li><a href="#/t/RHI%3A%3ARenderCommand">RenderCommand</a> の並びは C# の <a href="#/t/GameEngine.Native.NativeMethods.RenderCommand">NativeMethods.RenderCommand</a> と同じ (120 byte。C++ は static_assert で確かめる)。フィールドを足すなら両方</li>
  <li>RenderCommandBuffer にメソッドを足す (配列に積むだけ。毎フレーム確保しない)</li>
  <li>CommandContext.cpp の switch で実行する</li>
  <li>各パイプライン (Forward / Forward + SSAO / Deferred) の適切な所で呼ぶ</li>
</ol>
<div class="note">シーンの物は GPU で選別して ExecuteIndirect でまとめて描く (DrawScene)。自分のシェーダーのマテリアルの物だけはこの道から外れ、DrawCustom で 1 個ずつ描く。</div>
</article>

<article data-id="native" data-title="C++ の関数を C# から呼ぶ">
<h2>C++ の関数を C# から呼ぶ (P/Invoke)</h2>
<p>C# から C++ への入口は DLL ごとに 1 つのファイル。一覧と対応は <a href="#/native">C# ↔ C++ の境界</a>。</p>
<table>
<tr><th>DLL</th><th>C++ (公開関数)</th><th>C# (宣言)</th></tr>
<tr><td>Renderer.dll</td><td class="sig">Renderer/Source/rendererDll.cpp (RENDERER_API)</td><td class="sig">Runtime/Native/NativeMethods.cs</td></tr>
<tr><td>Physics.dll</td><td class="sig">Physics/Source/physicsDll.cpp</td><td class="sig">Runtime/Native/PhysicsNativeMethods.cs</td></tr>
<tr><td>Audio.dll</td><td class="sig">Audio/Source/audioDll.cpp</td><td class="sig">Runtime/Native/AudioNativeMethods.cs</td></tr>
<tr><td>Core.dll</td><td class="sig">Core/Source/Controller/controllerDll.cpp</td><td class="sig">Runtime/Native/GamepadNativeMethods.cs</td></tr>
</table>
<ol class="steps">
  <li><b>C++</b> : <code>RENDERER_API bool Renderer_DoSomething(const Foo* items, uint32_t count)</code> (<code>extern "C" __declspec(dllexport)</code>。名前は <code>DLL名_動詞</code>)</li>
  <li><b>C#</b> : <code>[DllImport(Dll, CallingConvention = CallingConvention.Cdecl)] public static extern bool Renderer_DoSomething(Foo* items, uint count);</code></li>
  <li>構造体は blittable (int / uint / float / IntPtr / 固定長の配列だけ) にし、<code>[StructLayout(LayoutKind.Sequential)]</code> で C++ と同じ並びにする。大きさを C++ の <code>static_assert(sizeof(...))</code> で確かめる</li>
  <li>物はハンドル (uint) でやり取りする。ポインタを C# に持たせない</li>
  <li>毎フレーム何度も呼ぶ物は配列でまとめて 1 回にする (P/Invoke は 1 回数十 ns)</li>
  <li>エンジンの利用者は NativeMethods を直接使わない。Engine / AssetManager / System から呼ぶ</li>
</ol>
<div class="note">C++ の RHI は、抽象クラス (<a href="#/t/RHI%3A%3AIRenderHardwareInterface">IRenderHardwareInterface</a>) と作る / 壊す関数だけを公開する (Public/rhi.h)。DirectX 12 の具象クラスは RHI.dll の外に出ない。</div>
</article>

<article data-id="asset" data-title="アセットの種類を足す">
<h2>アセットの種類を足す</h2>
<p>例 : SH4 のシェーダーグラフ (<code>.shadergraph.json</code>) を足した時に触った所。</p>
<ol class="steps">
  <li><a href="#/t/GameEngine.AssetKind">AssetKind</a> に値を足し、<a href="#/t/GameEngine.AssetDatabase">AssetDatabase</a>.<code>KindOf</code> で拡張子から決める。<code>.xxx.json</code> のような 2 つの拡張子は <code>SplitName</code> にも書く (名前を変える時に拡張子を残す)</li>
  <li>読む / 読み直す : <a href="#/t/GameEngine.AssetManager">AssetManager</a> (Model.cs) に <code>LoadXxx</code> / <code>ReloadXxx</code>。同じパスは同じ物を返す (キャッシュ)。名前が変わった時の付け替え (<code>onRenamed</code> の rekey) も</li>
  <li>エディター : <a href="#/t/GameEngine.Editor.ProjectPanel">ProjectPanel</a> のタイルの文字と色 (<code>builtInIcon</code>)、外で書き換えた時の読み直し (<code>reloadModified</code>)、作るボタン、ダブルクリック</li>
  <li>インスペクターの欄へドラッグで入れる : <code>ProjectPanel.AcceptDrop(AssetKind...)</code></li>
  <li>書き出し : <a href="#/t/GameEngine.Editor.AssetDependencies">AssetDependencies</a> が JSON の中の <code>{"guid": ...}</code> と <code>"Assets/..."</code> の文字を辿る。別の形なら walk を足す</li>
  <li><code>.gitignore</code> : Assets の <code>**/*.*</code> は外しているので、git に入れる種類は <code>!</code> の行を足す</li>
  <li>エディター拡張で済むなら <a href="#/t/GameEngine.Editor.AssetImporter">AssetImporter</a> (<code>[AssetImporter(".ext")]</code>) でも取り込める (エンジンを変えない)</li>
</ol>
</article>

<article data-id="editor" data-title="エディターを広げる">
<h2>エディターを広げる</h2>
<h3>ゲームのコードから (エンジンを変えない)</h3>
<p>Project/Scripts/Editor の例。エディターが読み込む時に <a href="#/t/GameEngine.Editor.EditorExtensions">EditorExtensions</a>.Scan が属性を探す。</p>
<pre><code>[EditorWindow("Game/Game Stats")]            // Window のメニュー
public sealed class GameStatsWindow : EditorWindow
{
    public override string Title =&gt; "Game Stats";
    public override void OnGUI()                // ImGui で描く
    {
        if (ImGui.Button("Stop all spins"))
            foreach (var e in World.Entities.Where(e =&gt; World.Has&lt;Spin&gt;(e)).ToList())
                EditorApi.Modify&lt;Spin&gt;(e, s =&gt; s with { DegreesPerSecond = 0 });   // 元に戻せる
    }
}

public static class GameMenu
{
    [MenuItem("Game/Create Spinning Box")] public static void CreateSpinningBox() { ... }
}

[CustomEditor(typeof(Spin))]                   // インスペクター / ギズモ
public sealed class SpinEditor : ComponentEditor&lt;Spin&gt; { ... }</code></pre>
<h3>エディターの本体に足す</h3>
<ul>
  <li>窓 : <a href="#/t/GameEngine.Editor.EditorApp">EditorApp</a> がフィールドで持ち、毎フレーム <code>Draw(ref bool open)</code> を呼ぶ (例 : <a href="#/t/GameEngine.Editor.BuildWindow">BuildWindow</a> / <a href="#/t/GameEngine.Editor.ShaderGraphWindow">ShaderGraphWindow</a>)。Window のメニューにも足す</li>
  <li>ショートカット : <code>EditorApp.handleShortcuts</code>。窓が自分で Ctrl+Z などを使うなら、その窓にフォーカスがある間は譲る (ShaderGraphWindow.HasFocus)</li>
  <li>元に戻す : シーンの変更は <a href="#/t/GameEngine.Editor.UndoStack">UndoStack</a> (<a href="#/t/GameEngine.Editor.ComponentEdit">ComponentEdit</a> / <a href="#/t/GameEngine.Editor.EntitiesEdit">EntitiesEdit</a> / <a href="#/t/GameEngine.Editor.CompoundEdit">CompoundEdit</a>)。アセットの変更は積まない</li>
  <li>テストから使う操作は public にして、ボタンと同じ道を通す (<a href="#/t/GameEngine.Editor.EditorTest">EditorTest</a> が呼ぶ)</li>
</ul>
</article>

<article data-id="shader" data-title="シェーダー / シェーダーグラフのノード">
<h2>自分のシェーダー / シェーダーグラフのノード</h2>
<h3>自分のシェーダー (.hlsl)</h3>
<pre><code>// @queue opaque | transparent      // @blend opaque | alpha | additive | premultiplied
// @cull back | front | none        // @zwrite on | off      // @depth test | read
// @param float   Speed 1 range(0, 4)
// @param color   Tint  (1, 0.5, 0.2, 1)
// @param texture Mask  white        // texture3d Volume builtin:PerlinWorley3D:64
float4 Surface(SurfaceInput IN)
{
    float3 albedo = ToLinear(Tint.rgb) * Mask.Sample(g_Sampler, IN.UV).rgb;
    return float4(Lit(albedo, IN.Normal, IN.WorldPosition, 0.0f, 0.5f), 1.0f);
}</code></pre>
<p><a href="#/t/GameEngine.ShaderAsset">ShaderAsset</a> がシーンのシェーダー (hlslTemplate.shader) の後ろに入力 / パラメーター / 関数 / エントリー (PSCustom) を書き足し、RHI が DXC でコンパイルする。エラーは「ファイル:行」。</p>
<h3>シェーダーグラフのノードを足す</h3>
<p><a href="#/t/GameEngine.ShaderGraph">ShaderGraph</a>.<code>buildLibrary</code> に 1 行足す。入力の式は型を合わせ済みで <code>c.In[i]</code> に来る。戻り値は出力の式。</p>
<pre><code>add("Posterize", "Math", "Posterize",
    new[] { P("In", D, "0.5"), P("Steps", F1, "4") },     // D = Dynamic (繋いだ物の大きさ)
    new[] { P("Out", D) },
    c =&gt; new[] { $"(floor({c.In[0]} * {c.In[1]}) / {c.In[1]})" },
    "Rounds to steps");</code></pre>
<ul>
  <li>一時の変数 : <code>c.Temp("float4", expr)</code> / 文 : <code>c.Line(...)</code> / マテリアルのパラメーター : <code>c.Parameter("float Name 1")</code> / エラー : <code>c.Fail("...")</code></li>
  <li>共通の HLSL の関数は <code>Helpers</code> に書く (名前は <code>_sg</code> で始める)</li>
  <li>EditorTest の「every node type generates HLSL that compiles」が全部のノードを 1 回でコンパイルして確かめる</li>
</ul>
</article>

<article data-id="camera" data-title="カメラ / 描画の設定 / マテリアル (v1.5)">
<h2>複数のカメラ / 描画の設定 / マテリアル (v1.5)</h2>
<h3>複数のカメラ (Unity と同じ)</h3>
<p>有効な <a href="#/t/GameEngine.Camera">Camera</a> + Transform を全部 (最大 8 台)、<code>Depth</code> の小さい順に描き、画面の <code>ViewportRect</code> の範囲に重ねる。一番小さい Depth のカメラがメインのカメラ (Volume / 音を聞く位置 / 影の距離の基準)。</p>
<table>
<tr><th>Camera の値</th><th>意味</th></tr>
<tr><td><code>Depth</code></td><td>描く順番 (大きい方が上に重なる)</td></tr>
<tr><td><code>ViewportRect</code></td><td>画面の範囲 (x, y, 幅, 高さ を 0〜1。x, y は<b>左下</b>が原点 = Unity と同じ)。投影はこの範囲の縦横の比で作る</td></tr>
<tr><td><code>ClearFlags</code></td><td>Skybox (空) / SolidColor (<code>BackgroundColor</code> の 1 色) / DepthOnly (消さない : 前のカメラの絵の上に、写った物だけを重ねる)</td></tr>
<tr><td><code>CullingMask</code></td><td>写すレイヤーのビット。物のレイヤーはエンティティの <code>EntityInfo.Layer</code> (インスペクターの名前の下の Layer。名前は Project Settings)</td></tr>
<tr><td><code>RenderPath</code> / <code>AntiAliasing</code> / <code>Ssao</code> / <code>Fxaa</code> / <code>Exposure</code> / <code>Tonemapper</code> / <code>Gamma</code></td><td>描き方 (カメラごと。以前はシーンの RenderSettings に 1 つだった)</td></tr>
</table>
<ul>
  <li>編集中のシーンビューはエディターのカメラ 1 台だけ (描き方は一番目のシーンのカメラの物)。再生するか「Game Camera」にすると、シーンのカメラが全部描かれる</li>
  <li>見本 : <code>Assets/Scenes/multicamera.scene.json</code> (メイン / 右上のミニマップ (Deferred・1 色の背景・レイヤー 8 の印) / 左下の小窓 (回る) / 重ねるカメラ (DepthOnly・レイヤー 9 の物だけ))</li>
</ul>
<h3>描く流れ (GraphicsSettings.RenderFrame)</h3>
<ol class="steps">
  <li><b>CameraSystem</b><small>カメラを Depth の順に並べて <code>Renderer_SetCameras</code> (変わった時だけ)。C++ は全部のカメラの行列と Culling Mask を RHI に持つ</small></li>
  <li><b>RenderSettingsSystem</b><small>メインのカメラの値と Project Settings の Rendering を、違う物だけ <a href="#/t/GameEngine.GraphicsSettings">Graphics</a> へ (キー / コードで変えた値は残る)。Volume は各カメラの位置で混ぜる</small></li>
  <li><b>カメラごとに</b><small>2 台目からは Graphics の値をそのカメラの物に入れ替え、<code>cmd.SetCamera(i)</code> (C++ が行列 / 定数を替え、GPU カリングをやり直す)。パイプラインはカメラごとに 1 つ (メインは <code>Graphics.Pipeline</code>)</small></li>
  <li><b>重ねる</b><small>画面全体で背景を消すカメラはバックバッファへ直接。範囲が一部 / DepthOnly のカメラは自分の絵 (RGBA8) に描き、<code>SetViewport</code> + <code>PSComposite</code> で範囲に重ねる (DepthOnly は乗算済みアルファ)</small></li>
</ol>
<p>自分のパイプラインは、最後の色を <code>settings.CameraTarget</code> へ描く (<code>Tonemap</code> はそうしている)。<code>settings.ClearFlags == DepthOnly</code> なら背景を描かず、透明 (0) のまま残す。</p>
<h3>Project Settings の Rendering (プロジェクト全体)</h3>
<p><a href="#/t/GameEngine.RenderingProjectValues">RenderingProjectValues</a> : 光の計算 (LightingModel) / 環境光 / 空の画像・明るさ・回転 / 影 / GPU パーティクル。全部のシーンで同じ値。シーンに置く RenderSettings の部品は無くした。</p>
<h3>1 Mesh / 1 Material (MeshRenderer.Materials)</h3>
<ul>
  <li><a href="#/t/GameEngine.MeshRenderer">MeshRenderer</a>.Materials[s] がサブメッシュ s のマテリアル (null / 足りない所はモデルに付いているマテリアル)</li>
  <li>エディターで Obj / Pmx / Fbx を置くと、<code>&lt;モデルのフォルダ&gt;/&lt;モデル名&gt;_Materials/&lt;材質名&gt;.material.json</code> をサブメッシュごとに作って入れる (<code>AssetManager.CreateModelMaterialAssets</code>。もうあるファイルは書き換えない)</li>
  <li>以前の <code>Material</code> (全部のサブメッシュに 1 つ) は読み込んだ時に Materials へ移る。マテリアルを物にドロップすると全部のサブメッシュに入る</li>
</ul>
<h3>物ごとの影 / シェーダーの雛形</h3>
<ul>
  <li><code>MeshRenderer.CastShadows</code> (切るとシャドーマップに描かない) / <code>ReceiveShadows</code> (切るとシャドーマップを読まない)。C++ の ObjectData.Info に印とレイヤーを入れ、GPU カリング (gpuCulling.shader) が影の視点 / Culling Mask で外す</li>
  <li>自分のシェーダーも何も書かずに効く (<code>Lit()</code> が見る)。Project の右クリック &gt; Create &gt; Shader &gt; Unlit Shader / PBR Shader で、書き方のヘルプ付きの雛形を作れる</li>
</ul>
</article>

<article data-id="ui" data-title="UI (Widget。v1.7)">
<h2>UI (Widget。v1.7)</h2>
<p>UE の UMG と同じ考え方。画面の UI は <b>Widget アセット</b> (<code>.widget.json</code>) に部品のツリーとして保存し、シーンの <a href="#/t/GameEngine.UIWidget">UIWidget</a> コンポーネント、またはコード (<a href="#/t/GameEngine.UI">UI</a>.CreateWidget) から使う。1 つの Widget アセットはいくつのシーンからでも使える (作るたびに別の <a href="#/t/GameEngine.UUserWidget">UUserWidget</a>)。</p>
<h3>しくみ</h3>
<ul>
  <li>部品は <a href="#/t/GameEngine.UWidget">UWidget</a> を継ぐクラス (名前は UE の C++ と同じく U 付き。WinForms の Button などとぶつからない)。子を持つ物は <a href="#/t/GameEngine.UPanelWidget">UPanelWidget</a>、親の中での置き方は <a href="#/t/GameEngine.UIPanelSlot">UIPanelSlot</a></li>
  <li>並べ方は Slate と同じ 2 回 : Prepass (子から欲しい大きさ) → Arrange (親が位置と大きさを決める。<code>Transform</code> = 自分の座標 → 画面のピクセル)。RenderTransform は描く時だけ</li>
  <li>大きさの単位は Widget アセットの基準の解像度 (既定 1920 x 1080)。画面の短い方の辺に合わせて拡大縮小する (<code>UIManager.ScaleFor</code>)</li>
  <li>描画は四角を <a href="#/t/GameEngine.UIDrawList">UIDrawList</a> に積み、Player では <code>Graphics.SubmitUI</code> (ImGui と同じ C++ の UI のパス。C++ は変えていない)、エディターでは ImGui の描画のリストに足す (シーンビューの絵の上 / Widget Designer の中)</li>
  <li>文字は System.Drawing でフォントを文字の表に描いて GPU へ (12〜128 px の決まった段。新しい文字はそのフレームの分を 1 枚の小さなテクスチャにする)。C++ に UI のテクスチャを消す API が無いので、作り直さないようにしている</li>
  <li>毎フレーム、ゲームの System の後 / エディターの GUI の前に <a href="#/t/GameEngine.UIManager">UIManager</a>.Update : UIWidget の反映 → 並べる → マウス / キー (再生中) → 描く</li>
</ul>
<h3>部品</h3>
<table>
<tr><th>Panel</th><td>CanvasPanel (Anchors / Offsets / Alignment / AutoSize / ZOrder) / HorizontalBox / VerticalBox (Auto / Fill + FillWeight) / Overlay / UniformGridPanel / ScrollBox / SizeBox / ScaleBox / Border / WidgetSwitcher</td></tr>
<tr><th>Common</th><td>TextBlock / Image / Button / ProgressBar / Spacer</td></tr>
<tr><th>Input</th><td>CheckBox / Slider / EditableTextBox</td></tr>
<tr><th>共通</th><td>Visibility (Visible / Collapsed / Hidden / HitTestInvisible / SelfHitTestInvisible) / IsEnabled / RenderOpacity / RenderTransform / Clipping</td></tr>
</table>
<h3>コードから</h3>
<pre><code>var hud = UI.CreateWidget("Assets/UI/HUD.widget.json");
hud.AddToViewport(10);                                   // 数の大きい物が手前
hud.GetWidget&lt;UTextBlock&gt;("Score")!.SetText("100");
hud.GetWidget&lt;UButton&gt;("Start")!.OnClicked += () =&gt; { };
hud.IsVisible = false;                                   // on / off
hud.SetZOrder(30);
hud.RemoveFromParent();
var fromScene = UI.GetWidget(entity);                    // シーンの UIWidget が出している物
if (UI.IsPointerOverUI) { /* ゲームのクリックを無視 */ }</code></pre>
<h3>エディター</h3>
<ul>
  <li>Project の右クリック &gt; Create &gt; Widget で作り、ダブルクリックで Widget Designer (Palette / Hierarchy / 画面 / Details)。変えると少し後に自動で保存</li>
  <li>シーンには UIWidget コンポーネント (Widget を Project から落とす)。再生中、ゲームのカメラの時だけシーンビューの上に出る (編集中は出さない)</li>
  <li>見本 : <code>Assets/Scenes/ui.scene.json</code> + <code>Scripts/UITest.cs</code> (1 / 2 / 3 / 4 / Z キーで on / off と重なり順)</li>
</ul>
<h3>部品を足す</h3>
<p>UWidget (子を持つなら UPanelWidget / UContentWidget) を継ぎ、<code>ComputeDesiredSize</code> / <code>ArrangeChildren</code> / <code>OnPaint</code> を書く。マウスを使うなら <code>HandlesPointer</code> と <code>OnMouseDown / Up / Drag</code>。保存されるのは public なフィールド。引数の無いコンストラクターを付け、ゲームの型なら <code>WidgetTypes.Register(typeof(...))</code> を呼ぶ。</p>
</article>

<article data-id="background" data-title="バックグラウンド / クラッシュレポート (v1.8)">
<h2>バックグラウンド / クラッシュレポート (v1.8)</h2>
<h3>後ろにある間は止める</h3>
<ul>
  <li><a href="#/t/GameEngine.Engine">Engine</a>.Run は、最小化中 / 他のアプリが前にある間、Update・物理・アニメーション・UI・描画・Present を全部しない。音は XAudio2 の StopEngine (<code>Audio_Suspend</code> / <code>Audio_Resume</code>)、パッドの振動も止める</li>
  <li>止めている間は <code>MsgWaitForMultipleObjectsEx</code> でメッセージが来るまで眠る (100 ms ごとにも見直す)。前に戻ると <code>Time.ResetFrameClock</code> で DeltaTime に止めていた時間を入れない (PlayTime も進まない)</li>
  <li>「前」の判定は前の窓のプロセス。同じプロセスの窓 (ファイルのダイアログ / 箱) が前にある時は止めない</li>
  <li><code>Engine.RunInBackground = true</code> で後ろでも動かす (最小化中は今まで通り止める)。Player は player.json の <code>RunInBackground</code> (Build Game の窓)、エディターは View &gt; Run In Background (exe の隣の editor_prefs.json)</li>
  <li>自動の確認 (<code>--editor-test</code> / <code>--quit-after</code> / Player の <code>--frames</code>) は常に動かす。止めた / 再開した時は <code>Engine.BackgroundChanged</code> と Console の <code>[Engine] Paused / Resumed</code></li>
</ul>
<h3>クラッシュレポート</h3>
<ul>
  <li>Main の最初に <a href="#/t/GameEngine.CrashReporter">CrashReporter</a>.Install(名前, 置き場)。<code>Crash_日時/</code> に report.txt (C# の例外の全文 / 版 / OS / CPU / メモリ / シーン / エンジンの様子 / 読み込んだ DLL)、crash.dmp (ミニダンプ)、native.txt (C++ で落ちた時 : 例外のコード / モジュール + オフセット / 関数と行)、log.txt (そのセッションのログ)。新しい 10 個だけ残す</li>
  <li>置き場 : Player は exe の隣の CrashReports (書けなければ %LOCALAPPDATA%)、エディター / ランチャーは <code>%LOCALAPPDATA%\Tsumugi Engine\CrashReports\&lt;名前&gt;</code></li>
  <li>受け取る所 : AppDomain.UnhandledException、WinForms のイベントの例外 (エディターは書いて続ける)、呼ぶ側の catch (<code>CrashReporter.Report</code>)、C++ は Core.dll の <code>Core/Source/Crash/crashHandler.cpp</code> (SetUnhandledExceptionFilter + ベクター例外ハンドラー。ダンプは先に作った別のスレッドが書く)</li>
  <li>C# から呼んだ C++ で落ちると .NET は FailFast で終わるので、ベクター例外ハンドラーで受け取る (落ちた所がネイティブの DLL の時だけ。C# の null 参照は除く)</li>
  <li>レポートに足したい情報は <code>CrashReporter.SetInfo("名前", 値)</code> (C++ で落ちた時の native.txt にも出る)</li>
  <li>確かめ方 : <code>--crash-test managed|native|thread|stackoverflow</code> (Player / エディター。10 フレーム後に落ちる)</li>
  <li>受け取れない物 : C# のスタックオーバーフロー、Environment.FailFast、各 DLL の CRT (/MT) の abort</li>
</ul>
</article>

// 目次

const GUIDES = [...$("#guides").content.querySelectorAll("article")].map(a => ({ id: a.dataset.id, title: a.dataset.title, node: a }));
function buildNav() {

// ==========================================================================
// 図 : 箱 / 線 / 拡大と移動
// ==========================================================================
function memberRows(t, max) {
  const order = ["constructor", "property", "field", "constant", "event", "method", "value"];
  const rows = t.members.filter(m => m.access !== "private" && order.includes(m.kind) && m.kind !== "constructor")
    .sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind));
  const icon = m => ({ property: "◆", field: "●", constant: "■", event: "⚡", method: "ƒ", value: "·" }[m.kind] || "·");
  const label = m => {
    if (m.kind === "method") return `${icon(m)} ${m.name}()`;
    if (m.kind === "value") return `· ${m.name}`;
    const type = m.sig.replace(/\{.*$/, "").replace(/\b(static|readonly|const|virtual|override|abstract|required|volatile|event|mutable|constexpr|inline)\b/g, "").trim();

}
function makeBox(t, opts = {}) {

  const stereo = `«${t.kind}»${t.mods && t.mods.includes("abstract") ? " abstract" : ""}`;
  const w = Math.ceil(Math.max(130, textWidth(displayName(t), FONT_NAME) + 28, textWidth(stereo, "10.5px Segoe UI") + 24, ...rows.map(r => textWidth(r, FONT_MEMBER) + 22)));

    <rect class="box${b.ghost ? " ghost" : ""}" width="${b.w}" height="${b.h}" rx="6"/>
    <rect class="head" x="1" y="1" width="${b.w - 2}" height="${b.head - 1}" rx="5"/>
    <rect x="0" y="0" width="4" height="${b.h}" rx="2" fill="${color}"/>

    <text x="${b.w / 2}" y="32" text-anchor="middle" style="font:${FONT_NAME}">${esc(displayName(b.t))}</text>`;

// 継承の線 : 子の上 → 親の下 (直角に曲げる)。親が interface なら破線 (実装)
function inheritEdge(child, parent) {

// ---------- クラス図 (グループ) : 継承の木を並べ、関係の無い物は下に詰める ----------
function classDiagram(types, opts) {

  const size = new Map();

    const sum = ch.reduce((a, c) => a + measure(c), 0) + GX * (ch.length - 1); size.set(id, Math.max(b.w, sum)); return size.get(id); };
  const place = (id, x, y) => { const b = boxes.get(id); const ch = kids.get(id) || []; const w = size.get(id); b.x = x + (w - b.w) / 2; b.y = y;
    let cx = x + (w - (ch.reduce((a, c) => a + size.get(c), 0) + GX * (ch.length - 1))) / 2;
    const ny = y + b.h + GY; let bottom = y + b.h;

  const trees = roots.filter(id => kids.has(id)), singles = roots.filter(id => !kids.has(id));
  trees.sort((a, b) => measure(b) - measure(a));
  singles.sort((a, b) => boxes.get(a).t.kind.localeCompare(boxes.get(b).t.kind) || boxes.get(a).t.name.localeCompare(boxes.get(b).t.name));
  const total = [...boxes.values()].reduce((a, b) => a + (b.w + GX) * (b.h + GY), 0);
  const maxW = Math.max(1200, Math.sqrt(total) * 1.7);
  let x = 0, y = 0, rowH = 0, width = 0;
  for (const id of trees) {
    const w = measure(id);

    const bottom = place(id, x, y); rowH = Math.max(rowH, bottom - y); x += w + GX * 2; width = Math.max(width, x);
  }
  if (trees.length) { y += rowH + GY + 10; x = 0; rowH = 0; }
  for (const id of singles) {
    const b = boxes.get(id);
    if (x > 0 && x + b.w > maxW) { x = 0; y += rowH + 28; rowH = 0; }
    b.x = x; b.y = y; x += b.w + GX; rowH = Math.max(rowH, b.h); width = Math.max(width, x);

  if (opts.uses) for (const b of boxes.values()) if (!b.ghost) for (const u of b.t.uses || []) if (boxes.has(u) && !boxes.get(u).ghost && u !== b.id) edges += useEdge(b, boxes.get(u));

}

// ---------- 型のまわりの図 : 親 (上) / 子 (下) / 使う (右) / 使われる (左) ----------
function neighborhood(t) {
  const center = makeBox(t, { members: true, maxRows: 14 });
  const parents = t.baseRefs.map(id => makeBox(T.get(id), { members: false }));
  const grand = [];
  let cur = T.get(t.baseRefs[0]);
  for (let i = 0; cur && cur.baseRefs.length && i < 4; i++) { const g = T.get(cur.baseRefs[0]); if (!g) break; grand.unshift(makeBox(g)); cur = g; }
  const kidsAll = t.derived.map(id => T.get(id)).sort((a, b) => a.name.localeCompare(b.name));
  const kids = kidsAll.slice(0, 18).map(k => makeBox(k));
  const uses = (t.uses || []).slice(0, 10).map(id => makeBox(T.get(id)));
  const usedBy = t.usedBy.slice(0, 10).map(id => makeBox(T.get(id)));
  const sideW = Math.max(180, ...uses.map(b => b.w), ...usedBy.map(b => b.w));
  const midRowW = row => row.reduce((a, b) => a + b.w, 0) + 24 * Math.max(0, row.length - 1);
  const kidRows = []; for (let i = 0; i < kids.length; i += 6) kidRows.push(kids.slice(i, i + 6));
  const midW = Math.max(center.w, midRowW(parents), ...grand.map(b => b.w), ...kidRows.map(midRowW));
  const leftX = 0, midX = usedBy.length ? sideW + 90 : 0, rightX = midX + midW + 90;
  let y = 0; const all = [center];
  const layRow = (row, yy) => { let x = midX + (midW - midRowW(row)) / 2; for (const b of row) { b.x = x; b.y = yy; x += b.w + 24; all.push(b); } return Math.max(...row.map(b => b.h)); };
  for (const g of grand) { g.x = midX + (midW - g.w) / 2; g.y = y; all.push(g); y += g.h + 44; }
  if (parents.length) y += layRow(parents, y) + 54;
  center.x = midX + (midW - center.w) / 2; center.y = y; y += center.h + 54;
  for (const row of kidRows) y += layRow(row, y) + 30;
  const sideTop = Math.max(0, center.y + center.h / 2 - (uses.length * 54) / 2);
  usedBy.forEach((b, i) => { b.x = leftX + (sideW - b.w); b.y = Math.max(0, center.y + center.h / 2 - (usedBy.length * 54) / 2) + i * 54; all.push(b); });
  uses.forEach((b, i) => { b.x = rightX; b.y = sideTop + i * 54; all.push(b); });
  let edges = "";
  for (let i = 1; i < grand.length; i++) edges += inheritEdge(grand[i], grand[i - 1]);
  if (grand.length && parents.length) edges += inheritEdge(parents[0], grand[grand.length - 1]);
  for (const p of parents) edges += inheritEdge(center, p);
  for (const k of kids) edges += inheritEdge(k, center);
  for (const u of uses) edges += useEdge(center, u);
  for (const u of usedBy) edges += useEdge(u, center);
  const width = (uses.length ? rightX + sideW : midX + midW) + 20;
  const height = Math.max(y, ...all.map(b => b.y + b.h)) + 20;
  const more = kidsAll.length > kids.length ? `<text class="stereo" x="${midX + midW / 2}" y="${height - 4}" text-anchor="middle">… 他 ${kidsAll.length - kids.length} 個の子</text>` : "";
  return { svg: `<g transform="translate(10,10)">${edges}${all.map(b => boxSvg(b, b === center)).join("")}${more}</g>`, width: width + 20, height: height + 30 };
}

function architecture() {
  const W = 1100;
  const pos = {
    launcher: [20, 40, 150], editor: [190, 40, 220], player: [430, 40, 170], console: [620, 40, 200], scripts: [840, 40, 230],
    runtime: [190, 160, 880],
    renderer: [100, 330, 210], physics: [380, 330, 190], audio: [620, 330, 180], core: [850, 330, 200],
    rhi: [100, 450, 210],
  };
  const ext = [["Direct3D 12 / DXGI / DXC", 60, 560, 290], ["XAudio2", 640, 450, 140], ["XInput / DirectInput", 860, 450, 180]];
  const boxH = 62;
  let s = `<rect class="band" x="0" y="20" width="${W}" height="104" rx="8"/><text class="bandlabel" x="12" y="15">ツール / アプリ (C#)</text>
    <rect class="band" x="0" y="140" width="${W}" height="104" rx="8"/><text class="bandlabel" x="12" y="135">エンジン本体 (C#)</text>
    <line x1="0" x2="${W}" y1="276" y2="276" stroke="var(--accent)" stroke-dasharray="8 6" stroke-width="1.5"/>
    <text x="${W - 8}" y="270" text-anchor="end" style="fill:var(--accent);font-size:12px;font-weight:600">P/Invoke : extern "C" の関数 + ハンドル (uint) + blittable な構造体</text>
    <rect class="band" x="0" y="310" width="${W}" height="220" rx="8"/><text class="bandlabel" x="12" y="305">ネイティブ (C++ の DLL)</text>
    <text class="bandlabel" x="12" y="555">外部</text>`;
  const center = id => { const [x, y, w] = pos[id]; return [x + w / 2, y, y + boxH]; };
  const edge = (a, b, cls = "") => { const [ax, , ab] = center(a), [bx, bt] = center(b); const my = (ab + bt) / 2; return `<path class="edge ${cls}" d="M${ax},${ab} C${ax},${my} ${bx},${my} ${bx},${bt - 2}" marker-end="url(#ah)"/>`; };
  let e = "";
  for (const m of D.modules) for (const d of m.deps) if (pos[m.id] && pos[d]) e += edge(m.id, d);
  e += edge("launcher", "editor", "use");
  for (const [label, x, y, w] of ext) s += `<rect class="box ghost" x="${x}" y="${y}" width="${w}" height="44" rx="6"/><text x="${x + w / 2}" y="${y + 27}" text-anchor="middle" style="font-size:12.5px;fill:var(--muted)">${esc(label)}</text>`;
  e += `<path class="edge use" d="M205,512 V560"/><path class="edge use" d="M710,392 V450"/><path class="edge use" d="M950,392 V450"/>`;
  let n = "";
  for (const [id, [x, y, w]] of Object.entries(pos)) {
    const m = MOD.get(id); if (!m) continue;
    const count = D.types.filter(t => t.module === id).length;
    n += `<a href="#/m/${id}"><g class="node" transform="translate(${x},${y})"><rect class="box" width="${w}" height="${boxH}" rx="8"/>
      <rect x="0" y="0" width="4" height="${boxH}" rx="2" fill="${m.lang === "C#" ? "var(--cs)" : "var(--cpp)"}"/>
      <text x="${w / 2}" y="26" text-anchor="middle" style="font:${FONT_NAME}">${esc(m.name)}</text>
      <text class="stereo" x="${w / 2}" y="46" text-anchor="middle">${esc(m.kind)} · ${count} 型</text></g></a>`;
  }
  const defs = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-line)"/></marker></defs>`;
  return { svg: defs + s + e + n, width: W, height: 620 };
}

function hierarchyPage() {
  const roots = D.types.filter(t => t.derived.length && !t.baseRefs.length).sort((a, b) => count(b) - count(a));

  };
  const extBases = new Map();
  for (const t of D.types) for (const b of t.baseText) { const k = t.lang + " " + b.replace(/<.*$/, "<>"); if (!extBases.has(k)) extBases.set(k, []); extBases.get(k).push(t); }
  const ext = [...extBases.entries()].filter(([, v]) => v.length >= 2).sort((a, b) => b[1].length - a[1].length);
  page(`<div class="crumbs"><a href="#/">概要</a></div><h1>継承の木</h1>
    <p class="lead">このエンジンの中で親子のある型 (${roots.length} 本の木)。interface は「実装している型」が子。</p>
    <div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(360px,1fr))">${roots.map(r => `<div class="card tree"><ul>${node(r, 0, new Set())}</ul></div>`).join("")}</div>
    <h2>外の型 (.NET / Windows など) を継ぐ型</h2>
    <table><tr><th style="width:28%">外の型</th><th>継ぐ / 実装する型</th></tr>${ext.map(([k, v]) => `<tr><td class="sig">${esc(k)}</td><td>${v.map(t => typeLink(t)).join(", ")}</td></tr>`).join("")}</table>`);
}

function nativePage() {
  const mods = [...new Set(D.exports.map(e => e.module))];
  // C# の Native の構造体と C++ の同じ名前の構造体 (並びが同じはず)
  // 同じ名前の C++ の構造体が複数ある時は、その C# の宣言のクラスが呼ぶ DLL のモジュールを先に見る
  // (以前は最初の物を選び、Renderer の MaterialDesc を RHI の MaterialDesc と比べていた)
  const prefer = { NativeMethods: ["renderer", "rhi"], PhysicsNativeMethods: ["physics"], AudioNativeMethods: ["audio"], GamepadNativeMethods: ["core"] };
  // 先に、公開関数の同じ位置の引数から分かった組 (make_reference.py)。残りは名前が同じ物 (「名前だけ」と出す)
  const pairs = (D.structPairs || []).map(p => [T.get(p.cs), T.get(p.cpp), p.via]).filter(p => p[0] && p[1]);
  const paired = new Set(pairs.map(p => p[0].id));
  for (const cs of D.types.filter(t => t.lang === "C#" && t.ns === "GameEngine.Native" && t.kind === "struct" && !paired.has(t.id))) {
    const order = prefer[(T.get(cs.parent) || {}).name] || [];
    const rank = t => { const i = order.indexOf(t.module); return i < 0 ? 99 : i; };
    const cpp = D.types.filter(t => t.lang === "C++" && t.kind === "struct" && t.name === cs.name).sort((a, b) => rank(a) - rank(b));
    if (cpp.length) pairs.push([cs, cpp[0], null]);
  }
  // 詰め物 (Padding) は数えない (C++ は float Padding[3]、C# は Padding0..2 のように書き方が違う)
  const fields = t => t.members.filter(m => m.kind === "field" && !m.static && !/^_?pad/i.test(m.name)).length;
  let html = `<div class="crumbs"><a href="#/">概要</a></div><h1>C# ↔ C++ の境界</h1>
    <p class="lead">C++ の DLL が公開する関数 (extern "C") と、それを呼ぶ C# の宣言 (DllImport) の対応。作り方は <a href="#/g/native">ガイド</a>。</p>
    <div class="stats">${mods.map(id => { const list = D.exports.filter(e => e.module === id); const miss = list.filter(e => !e.cs).length;
      return `<div class="stat"><b>${list.length}</b><span>${esc(MOD.get(id).name)}.dll${miss ? ` / <span class="bad">C# 無し ${miss}</span>` : ""}</span></div>`; }).join("")}</div>`;
  if (pairs.length) html += `<h2>同じ並びの構造体 (C# の Native ↔ C++)</h2><p class="lead">名前が同じ物の、フィールドの数 (static と詰め物を除く)。数が違う物は、並びが本当に違うか、名前が同じだけの別の構造体 (C++ の中だけで使う物) です。ソースで確かめてください。</p>
    <table><tr><th>C#</th><th>C++</th><th>分かった所</th><th style="width:130px">フィールドの数</th></tr>${pairs.map(([a, b, via]) => { const fa = fields(a), fb = fields(b);
      return `<tr><td>${typeLink(a, qualified(a))}</td><td>${typeLink(b, b.id)}</td><td class="files">${via ? `<a href="#/native" onclick="setTimeout(()=>document.getElementById('x-${esc(via)}')?.scrollIntoView(),50)">${esc(via)}</a> の引数` : "名前だけ"}</td>
        <td class="${fa === fb ? "ok" : "bad"}">${fa} / ${fb}${fa === fb ? " ✓" : ""}</td></tr>`; }).join("")}</table>`;
  for (const id of mods) {
    const list = D.exports.filter(e => e.module === id);
    html += `<h2>${esc(MOD.get(id).name)}.dll <span class="count">${list.length}</span></h2>
      <table><tr><th style="width:42%">C++ (${esc(list[0].file)})</th><th>C# の宣言</th></tr>${list.map(e => `<tr id="x-${esc(e.name)}">
      <td class="sig">${esc(e.sig)}${e.doc ? `<div class="mdoc" style="font-family:inherit;margin-top:4px">${esc(e.doc)}</div>` : ""}<div class="files">${esc(e.file)}:${e.line}</div></td>
      <td class="sig">${e.cs ? `${esc(e.cs.sig)}<div class="files">${esc(e.cs.file)}:${e.cs.line}</div>` : `<span class="bad">C# の宣言なし</span><div class="files">C++ の中だけで使う / C# から呼んでいない</div>`}</td></tr>`).join("")}</table>`;
  }
  page(html);
}

function guidePage(id) {
  const g = GUIDES.find(x => x.id === id);
  if (!g) return notFound();
  page(`<div class="crumbs"><a href="#/">概要</a> / 開発ガイド</div><div class="guide-body"></div>`);
  const body = view.querySelector(".guide-body");
  body.appendChild(g.node.cloneNode(true));
  body.firstElementChild.style.display = "block";
  const i = GUIDES.indexOf(g);
  body.insertAdjacentHTML("beforeend", `<div class="toolbar" style="margin-top:28px;justify-content:space-between">${i > 0 ? `<a class="btn" href="#/g/${GUIDES[i - 1].id}">← ${esc(GUIDES[i - 1].title)}</a>` : "<span></span>"}${i < GUIDES.length - 1 ? `<a class="btn" href="#/g/${GUIDES[i + 1].id}">${esc(GUIDES[i + 1].title)} →</a>` : ""}</div>`);
}

function searchPage(q) {
  const s = q.trim().toLowerCase();
  if (!s) return overview();
  const score = name => { const n = name.toLowerCase(); return n === s ? 0 : n.startsWith(s) ? 1 : n.includes(s) ? 2 : 9; };
  const types = D.types.map(t => [score(t.name), t]).filter(x => x[0] < 9).sort((a, b) => a[0] - b[0] || a[1].name.length - b[1].name.length).slice(0, 80);
  const members = [];
  for (const t of D.types) for (const m of t.members) { const sc = score(m.name); if (sc < 9) members.push([sc, t, m]); }
  members.sort((a, b) => a[0] - b[0] || a[2].name.length - b[2].name.length);
  const ex = D.exports.filter(e => e.name.toLowerCase().includes(s)).slice(0, 40);
  const docHits = s.length >= 2 ? D.types.filter(t => !t.docFromFile && t.doc.toLowerCase().includes(s) && score(t.name) === 9).slice(0, 30) : [];
  page(`<h1>「${esc(q)}」</h1><div class="results">
    <h2>型 <span class="count">${types.length}</span></h2>${types.map(([, t]) => `<a class="r" href="#/t/${enc(t.id)}">${kindBadge(t)}<span>${esc(qualified(t))}<div class="sub">${esc(firstLine(t.docFromFile ? "" : t.doc))}</div></span><span class="sub">${esc(MOD.get(t.module).name)}</span></a>`).join("") || `<p class="lead">なし</p>`}
    <h2>メンバー <span class="count">${members.length > 120 ? "120 / " + members.length : members.length}</span></h2>${members.slice(0, 120).map(([, t, m]) => `<a class="r" href="#/t/${enc(t.id)}"><span class="kind" style="background:var(--faint)">${m.kind[0].toUpperCase()}</span><span class="mono">${esc(m.sig)}<div class="sub">${esc(qualified(t))} — ${esc(firstLine(m.doc))}</div></span><span class="sub">${esc(MOD.get(t.module).name)}</span></a>`).join("") || `<p class="lead">なし</p>`}
    ${ex.length ? `<h2>DLL の公開関数</h2>${ex.map(e => `<a class="r" href="#/native"><span class="kind" style="background:var(--cpp)">ƒ</span><span class="mono">${esc(e.sig)}<div class="sub">${esc(e.file)}</div></span><span class="sub">${esc(MOD.get(e.module).name)}</span></a>`).join("")}` : ""}
    ${docHits.length ? `<h2>説明に含む型</h2>${docHits.map(t => `<a class="r" href="#/t/${enc(t.id)}">${kindBadge(t)}<span>${esc(qualified(t))}<div class="sub">${esc(firstLine(t.doc))}</div></span><span class="sub">${esc(MOD.get(t.module).name)}</span></a>`).join("")}` : ""}
  </div>`);
}
function notFound() { page(`<h1>見つかりません</h1><p><a href="#/">概要へ</a></p>`); }

// ==========================================================================
// 道案内
// ==========================================================================
function route() {
  document.body.classList.remove("nav-open");
  const h = decodeURIComponent(location.hash.slice(1) || "/");
  const [, a, b, c] = h.split("/");
  if (a === "m") modulePage(b, c);
  else if (a === "t") typePage(h.slice(3));
  else if (a === "hier") hierarchyPage();
  else if (a === "native") nativePage();
  else if (a === "g") guidePage(b);
  else if (a === "s") searchPage(h.slice(3));
  else overview();
  // 目次の今の所
  document.querySelectorAll("#nav a.item").forEach(x => x.classList.toggle("active", x.getAttribute("href") === location.hash || (location.hash === "" && x.getAttribute("href") === "#/")));
  const t = a === "t" && T.get(h.slice(3));
  const mod = a === "m" ? b : t ? t.module : null;
  if (mod) { const d = document.querySelector(`#nav details[data-mod="${mod}"]`); if (d) { d.open = true; if (t) { const link = d.querySelector(`a[href="#/t/${CSS.escape(enc(t.id))}"]`); if (link) { let p = link.parentElement; while (p && p !== d) { if (p.tagName === "DETAILS") p.open = true; p = p.parentElement; } link.scrollIntoView({ block: "nearest" }); } } } }
}
buildNav();
const q = $("#q");
let timer = 0;
q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => { location.hash = q.value.trim() ? "#/s/" + enc(q.value.trim()) : "#/"; }, 160); });
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== q && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); q.select(); } });
window.addEventListener("hashchange", route);
route();
})();
</script>

<title>GameEngine Reference</title>
<!--
  エンジンの開発者向けリファレンス (Docs/Reference)
  このファイル (template.html) は手で書く所 : 見た目 / 図の描き方 / 開発ガイド
  index.html は make_reference.py が作る (ソースを読んだ JSON を下の DATA に入れる)。index.html は直接書き換えない
-->
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --text: #1d2330; --muted: #5d6677; --faint: #8a93a3;
  --border: #dde1e8; --accent: #2f6fde; --accent-soft: #e6eefc; --warn: #b4540a; --warn-soft: #fdf0e3; --ok: #1d8a4e;
  --code-bg: #f2f4f8; --shadow: 0 1px 2px rgba(20,30,50,.06), 0 2px 8px rgba(20,30,50,.05);
  --k-class: #2f6fde; --k-struct: #12856f; --k-interface: #8a44c9; --k-enum: #b4740a; --k-record: #c2417a; --k-union: #666;
  --cs: #6f42c1; --cpp: #0b6fa4;
  --d-box: #ffffff; --d-head: #eef3fd; --d-line: #7d8899; --d-use: #a3acba; --d-ghost: #f3f4f6; --d-text: #1d2330;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1b1f26; --panel-2: #222731; --text: #e3e7ee; --muted: #a3acba; --faint: #737c8c;
    --border: #2e3440; --accent: #6ea2ff; --accent-soft: #1f2d47; --warn: #f0a35a; --warn-soft: #3a2a18; --ok: #4cc584;
    --code-bg: #20252e; --shadow: none;
    --k-class: #6ea2ff; --k-struct: #43c6a8; --k-interface: #c08af0; --k-enum: #e3a947; --k-record: #ef7bae; --k-union: #aaa;
    --cs: #b391f5; --cpp: #59b7e8;
    --d-box: #1f242d; --d-head: #26324a; --d-line: #8792a5; --d-use: #5d6677; --d-ghost: #1a1d23; --d-text: #e3e7ee;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --panel: #1b1f26; --panel-2: #222731; --text: #e3e7ee; --muted: #a3acba; --faint: #737c8c;
  --border: #2e3440; --accent: #6ea2ff; --accent-soft: #1f2d47; --warn: #f0a35a; --warn-soft: #3a2a18; --ok: #4cc584;
  --code-bg: #20252e; --shadow: none;
  --k-class: #6ea2ff; --k-struct: #43c6a8; --k-interface: #c08af0; --k-enum: #e3a947; --k-record: #ef7bae; --k-union: #aaa;
  --cs: #b391f5; --cpp: #59b7e8;
  --d-box: #1f242d; --d-head: #26324a; --d-line: #8792a5; --d-use: #5d6677; --d-ghost: #1a1d23; --d-text: #e3e7ee;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.65 "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Meiryo", system-ui, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre, .mono { font-family: "Cascadia Mono", "Consolas", "BIZ UDGothic", ui-monospace, monospace; font-size: 12.5px; }
pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; line-height: 1.5; }
code { background: var(--code-bg); border-radius: 4px; padding: 1px 5px; }
pre code { background: none; padding: 0; }
h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: .01em; }
h2 { font-size: 19px; margin: 32px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
h3 { font-size: 15.5px; margin: 22px 0 8px; }
.layout { display: grid; grid-template-columns: 290px 1fr; height: 100vh; }
.side { border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 16px 16px 10px; border-bottom: 1px solid var(--border); }
.brand .title { font-weight: 700; font-size: 16px; }
.brand .meta { color: var(--faint); font-size: 11.5px; margin-top: 2px; }
.search { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.search input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font: inherit; }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.nav { overflow-y: auto; padding: 8px 6px 24px; flex: 1; }
.nav .sec { color: var(--faint); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin: 14px 10px 4px; }
.nav a.item, .nav summary { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 6px; color: var(--text); cursor: pointer; font-size: 13.5px; }
.nav a.item:hover, .nav summary:hover { background: var(--panel-2); text-decoration: none; }
.nav a.item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.nav details > div a.item { font-size: 12.5px; padding: 2px 10px; }

.nav summary::before { content: "▸"; color: var(--faint); font-size: 10px; width: 10px; }
.nav details[open] > summary::before { content: "▾"; }
.count { margin-left: auto; color: var(--faint); font-size: 11px; }
.main { overflow-y: auto; min-width: 0; }
.page { max-width: 1180px; margin: 0 auto; padding: 28px 36px 80px; }
.page.wide { max-width: none; }
.lead { color: var(--muted); margin: 4px 0 18px; }
.crumbs { color: var(--faint); font-size: 12.5px; margin-bottom: 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); }
.card h4 { margin: 0 0 4px; font-size: 14.5px; display: flex; gap: 8px; align-items: center; }
.card p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 6px; }
.stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; min-width: 120px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 0 8px; font-size: 11px; font-weight: 600; line-height: 19px; border: 1px solid currentColor; white-space: nowrap; }
.lang-cs { color: var(--cs); } .lang-cpp { color: var(--cpp); }
.kind { display: inline-block; width: 18px; height: 18px; border-radius: 5px; color: #fff; font-size: 11px; font-weight: 700; text-align: center; line-height: 18px; flex: none; }
.k-class { background: var(--k-class); } .k-struct { background: var(--k-struct); } .k-interface { background: var(--k-interface); }
.k-enum { background: var(--k-enum); } .k-record { background: var(--k-record); } .k-union { background: var(--k-union); }
.doc { white-space: pre-wrap; background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
.doc.file { border-left-color: var(--faint); }
.doc .from { color: var(--faint); font-size: 11.5px; display: block; margin-bottom: 4px; }

.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.page, .doc, .files, .mono { overflow-wrap: anywhere; }
table { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
th, td { text-align: left; vertical-align: top; padding: 7px 12px; border-bottom: 1px solid var(--border); }
th { background: var(--panel-2); font-size: 12px; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: none; }
td.sig { font-family: "Cascadia Mono", "Consolas", monospace; font-size: 12.5px; word-break: break-word; }
td.mdoc { color: var(--muted); white-space: pre-wrap; font-size: 13px; }
.acc { font-size: 10.5px; color: var(--faint); margin-right: 6px; font-family: inherit; }
.acc.internal { color: var(--warn); } .acc.protected { color: var(--k-interface); }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.toolbar label { color: var(--muted); font-size: 13px; display: inline-flex; gap: 5px; align-items: center; }
button, .btn { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
button:hover { border-color: var(--accent); }

.tabs a.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.diagram { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin: 12px 0; height: 640px; touch-action: none; cursor: grab; }
.diagram.short { height: auto; cursor: default; }
.diagram svg { display: block; user-select: none; }
.diagram .zoom { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
.diagram .zoom button { padding: 3px 10px; background: var(--panel); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; align-items: center; }
.legend svg { vertical-align: middle; }
svg text { fill: var(--d-text); }
svg .box { fill: var(--d-box); stroke: var(--d-line); }
svg .box.ghost { fill: var(--d-ghost); stroke-dasharray: 4 3; }
svg .head { fill: var(--d-head); }
svg .node { cursor: pointer; }
svg .node:hover .box { stroke: var(--accent); stroke-width: 2; }
svg .node.focus .box { stroke: var(--accent); stroke-width: 2.5; }
svg .edge { fill: none; stroke: var(--d-line); stroke-width: 1.4; }
svg .edge.use { stroke: var(--d-use); stroke-dasharray: 5 4; }
svg .edge.impl { stroke-dasharray: 6 4; }
svg .tri { fill: var(--d-box); stroke: var(--d-line); stroke-width: 1.4; }
svg .stereo { fill: var(--faint); font-size: 10.5px; }
svg .member { font-family: "Cascadia Mono", "Consolas", monospace; font-size: 11px; fill: var(--muted); }
svg .band { fill: var(--panel-2); }
svg .bandlabel { fill: var(--faint); font-size: 12px; font-weight: 700; letter-spacing: .06em; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 6px; }
.steps li { counter-increment: s; position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px 8px 50px; min-height: 42px; }
.steps li::before { content: counter(s); position: absolute; left: 12px; top: 9px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; font-size: 12px; }
.steps li small { color: var(--muted); display: block; }
.note { background: var(--warn-soft); border: 1px solid var(--border); border-left: 3px solid var(--warn); border-radius: 8px; padding: 10px 14px; margin: 12px 0; }
.ok { color: var(--ok); } .bad { color: var(--warn); font-weight: 600; }
.tree ul { list-style: none; margin: 0; padding-left: 20px; border-left: 1px dashed var(--border); }
.tree > ul { padding-left: 0; border: none; }
.tree li { margin: 2px 0; }
.tree .t { display: inline-flex; gap: 6px; align-items: center; }

.guide article { display: none; }
.guide h2:first-child { margin-top: 8px; }
.guide li { margin: 3px 0; }

.menu-btn { display: none; }

  .layout { grid-template-columns: 1fr; }

}

<!-- ======================================================================
     開発ガイド (手で書く。data-id がページの名前)
     ====================================================================== -->
<template id="guides">

<article data-id="build" data-title="ビルドと実行 / テスト">
<h2>ビルドと実行 / テスト</h2>
<h3>何がどこにできるか</h3>
<ul>
  <li>C++ (<code>GameEngine.sln</code> : RHI / Renderer / Physics / Audio / Core) は <b>Visual Studio 2022 の MSBuild</b> で x64 の Debug / Release をビルドする。DLL と <code>Shader</code> フォルダは見本 (GameEngine_console) の出力の隣に置かれ、C# の exe はそこから DLL を読む</li>
  <li>C# の見本 <code>GameEngine_console</code> も VS の MSBuild でビルドする (COM の参照があるので <code>dotnet build</code> は失敗する)
<pre><code>"C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe" CSharp_console\GameEngine_console\GameEngine_console.csproj /p:Configuration=Release /p:Platform=x64</code></pre></li>
  <li>エディター / Player / ランチャーは <code>dotnet build</code> でよい。<b>必ず <code>-p:Platform=x64</code> を付ける</b> (付けないと <code>bin\Release</code> に出て、いつも動かしている <code>bin\x64\Release</code> が古いまま)
<pre><code>dotnet build CSharp_console\GameEngine.Editor\GameEngine.Editor.csproj -c Release -p:Platform=x64</code></pre></li>
  <li>エディターの作業フォルダは見本の出力フォルダ (シェーダーを <code>../Shader</code> から読む)。<code>RHI/Source/Shader</code> の .shader を変えたら、見本をビルドし直して写す (エディターは実行中に見張って読み直す)</li>
  <li>RHI のルートシグネチャ / ルートパラメーターを変えたら、RHI.dll を <b>Debug と Release の両方</b> ビルドし直す (古い DLL は PSO を作れない)</li>
</ul>
<h3>テスト</h3>
<table>
<tr><th>コマンド</th><th>中身</th></tr>
<tr><td class="sig">GameEngine.Editor.exe --editor-test</td><td>エディターの自動の確認 (<a href="#/t/GameEngine.Editor.EditorTest">EditorTest</a>)。置く / 元に戻す / 保存 / 再生 / プレハブ / 書き出し / 書き出したゲームとエディターの動きの比較 / シェーダー など。最後に <code>[Test] editor : pass N / fail M</code></td></tr>
<tr><td class="sig">GameEngine_console.exe --hierarchy-test</td><td>親子 (Hierarchy) の確認</td></tr>
<tr><td class="sig">GameEngine_console.exe --serialize-test</td><td>シーンの保存 / 読み込みの確認</td></tr>
<tr><td class="sig">GameEngine_console.exe --load-scene &lt;path&gt;</td><td>シーンを見本の exe で開く (性能の確認。F1 でプロファイラー、終わると <code>[Profiler] Summary</code> を出す)</td></tr>
</table>
<p>Debug の exe は D3D12 のデバッグレイヤー (検証) が有効。テストの出力に <code>D3D12 ERROR</code> / <code>WARNING</code> が 0 であることも確かめる。</p>
<h3>エディターの起動の引数</h3>
<pre><code>GameEngine.Editor.exe [--project &lt;folder&gt;] [--scene &lt;path&gt;] [--open-graph Assets/....shadergraph.json]
                      [--editor-test] [--resave-scenes] [--quit-after N]</code></pre>
<p>v2.1 : <code>--scene</code> が無ければ、前に開いていたシーン (プロジェクトの <code>Library/EditorState.json</code>) を開く。</p>
</article>

<article data-id="ecs" data-title="コンポーネントと System を足す">
<h2>コンポーネントと System を足す (ECS)</h2>
<p>データは <a href="#/t/GameEngine.IComponent">IComponent</a> を付けた <b>struct</b>、処理は <a href="#/t/GameEngine.ISystem">ISystem</a> を実装したクラス。入れ物は <a href="#/t/GameEngine.World">World</a> (型ごとの <a href="#/t/GameEngine.ComponentPool%3C%3E">ComponentPool&lt;T&gt;</a>)。</p>
<pre><code>public struct Spin : IComponent
{
    [Range(0, 720), Tooltip("1 秒に回る角度")]
    public float DegreesPerSecond;
}

[GameSystem]                       // エディター / Player が見つけて登録する (Order で順番)
public sealed class SpinSystem : ISystem
{
    public void Update(World world)
    {
        var angle = Time.DeltaTime * MathEx.Deg2Rad;
        world.ForEach((Entity _, ref Transform transform, ref Spin spin) =&gt;
        {
            transform.Rotation = Quaternion.Normalize(transform.Rotation * Quaternion.CreateFromAxisAngle(Vector3.UnitY, spin.DegreesPerSecond * angle));
        });
    }
}</code></pre>
<ul>
  <li>保存とインスペクター : public のフィールドが自動で保存され、インスペクターに出る (<a href="#/t/GameEngine.ComponentRegistry">ComponentRegistry</a> がリフレクションで 1 回だけ調べる)。登録は要らない</li>
  <li>属性 : <a href="#/t/GameEngine.SerializeFieldAttribute">[SerializeField]</a> / <a href="#/t/GameEngine.HideInInspectorAttribute">[HideInInspector]</a> / <a href="#/t/GameEngine.RangeAttribute">[Range]</a> / <a href="#/t/GameEngine.TooltipAttribute">[Tooltip]</a> / <a href="#/t/GameEngine.HeaderAttribute">[Header]</a> / <a href="#/t/GameEngine.LayerAttribute">[Layer]</a> / <a href="#/t/GameEngine.ComponentInfoAttribute">[ComponentInfo]</a> (表示名 / 分類 / Hidden / DontSave)</li>
  <li>固定の刻み (物理の前) : <a href="#/t/GameEngine.IFixedSystem">IFixedSystem</a> の <code>FixedUpdate(World)</code>。剛体に力をかけるのはここ</li>
  <li>時間 : ゲームのコードは <a href="#/t/GameEngine.Time">Time</a>.<code>DeltaTime</code> / <code>PlayTime</code> (TotalTime はエディターの時間)</li>
  <li><code>ForEach</code> の中でエンティティ / コンポーネントを足したり消したりしない (配列の並びが変わる)。リストに集めて後で行う</li>
  <li>Entity は番号 (消して作り直すと変わる)。保存では <a href="#/t/GameEngine.EntityInfo">EntityInfo</a>.Id (GUID) で参照を書く</li>
  <li>毎フレームの順番 (<a href="#/t/GameEngine.Engine">Engine</a>) : 登録した System → Transform の行列 → カメラ → 描画へ反映 → ライト → パーティクル → 音 → 描画パイプライン</li>
</ul>
<div class="note">エンジンに組み込む System (Runtime の <code>Systems/</code>) は <code>Engine</code> のコンストラクターで並べる。ゲームのコード (Project/Scripts) はエディターが実行中にコンパイルして読み直す (<a href="#/t/GameEngine.Editor.ScriptHost">ScriptHost</a>)。</div>
</article>

<article data-id="render" data-title="描画パイプライン / 描画の命令を足す">
<h2>描画パイプライン / 描画の命令を足す</h2>
<p>1 フレームの描き方は C# で組み立てる (<a href="#/t/GameEngine.Rendering.RenderPipeline">RenderPipeline</a>。Unity の SRP に当たる)。<code>Render</code> は <a href="#/t/GameEngine.Rendering.RenderCommandBuffer">RenderCommandBuffer</a> に命令を<b>積むだけ</b>。エンジンが 1 フレーム分を 1 回の P/Invoke (<code>Renderer_Render</code>) で C++ に渡し、RHI の <code>CommandContext</code> が順に実行する。</p>
<ol class="steps">
  <li><b>C# : パイプライン</b><small><a href="#/t/GameEngine.Rendering.ForwardRenderPipeline">ForwardRenderPipeline</a> / <a href="#/t/GameEngine.Rendering.DeferredRenderPipeline">DeferredRenderPipeline</a> が例。Initialize でレンダーターゲット (<a href="#/t/GameEngine.Rendering.RenderTexture">RenderTexture</a>) と全画面のシェーダー (<a href="#/t/GameEngine.Rendering.FullscreenShader">FullscreenShader</a>.Load) を作る</small></li>
  <li><b>C# : 命令</b><small>SetRenderTarget(s) / ClearColor / ClearDepth / DrawScene / DrawFullscreen / UpdateParticles / DrawParticles / DrawCustom / SetCamera / SetViewport (v1.5) / BeginPass・EndPass (v1.11。区切りだけ。<a href="#/g/profiler">プロファイラー</a>)</small></li>
  <li><b>C++ : 実行</b><small>RHI/Source/DirectX12/RHIObject/CommandContext.cpp の <code>switch (RenderCommandType)</code></small></li>
</ol>
<h3>全画面のパス (ポストエフェクト) を足す</h3>
<pre><code>// Initialize
_blur = FullscreenShader.Load("../Shader/postProcess.shader", "PSBlur");
// Render
using (cmd.BeginPass("Blur"))   // v1.11 : プロファイラー / PIX にパスとして出る (無くても描ける)
{
    cmd.SetRenderTarget(_temp);
    cmd.DrawFullscreen(_blur, stackalloc[] { hdr }, stackalloc[] { 1.0f / width, 0.0f });
}
// シェーダーでは g_Inputs[0].x がテクスチャの番号、g_Params が値</code></pre>
<h3>新しい命令の種類を足す</h3>
<ol class="steps">
  <li>RHI/Source/Public/rhiTypes.h の <a href="#/t/RHI%3A%3ARenderCommandType">RenderCommandType</a> に値を足す (Arg0 / Arg1 / Inputs / Params の意味をコメントに書く)</li>
  <li><a href="#/t/RHI%3A%3ARenderCommand">RenderCommand</a> の並びは C# の <a href="#/t/GameEngine.Native.NativeMethods.RenderCommand">NativeMethods.RenderCommand</a> と同じ (120 byte。C++ は static_assert で確かめる)。フィールドを足すなら両方</li>
  <li>RenderCommandBuffer にメソッドを足す (配列に積むだけ。毎フレーム確保しない)</li>
  <li>CommandContext.cpp の switch で実行する</li>
  <li>各パイプライン (Forward / Forward + SSAO / Deferred) の適切な所で呼ぶ</li>
</ol>
<div class="note">シーンの物は GPU で選別して ExecuteIndirect でまとめて描く (DrawScene)。自分のシェーダーのマテリアルの物だけはこの道から外れ、DrawCustom で 1 個ずつ描く。</div>
</article>

<article data-id="native" data-title="C++ の関数を C# から呼ぶ">
<h2>C++ の関数を C# から呼ぶ (P/Invoke)</h2>
<p>C# から C++ への入口は DLL ごとに 1 つのファイル。一覧と対応は <a href="#/native">C# ↔ C++ の境界</a>。</p>
<table>
<tr><th>DLL</th><th>C++ (公開関数)</th><th>C# (宣言)</th></tr>
<tr><td>Renderer.dll</td><td class="sig">Renderer/Source/rendererDll.cpp (RENDERER_API)</td><td class="sig">Runtime/Native/NativeMethods.cs</td></tr>
<tr><td>Physics.dll</td><td class="sig">Physics/Source/physicsDll.cpp</td><td class="sig">Runtime/Native/PhysicsNativeMethods.cs</td></tr>
<tr><td>Audio.dll</td><td class="sig">Audio/Source/audioDll.cpp</td><td class="sig">Runtime/Native/AudioNativeMethods.cs</td></tr>
<tr><td>Core.dll</td><td class="sig">Core/Source/Controller/controllerDll.cpp</td><td class="sig">Runtime/Native/GamepadNativeMethods.cs</td></tr>
</table>
<ol class="steps">
  <li><b>C++</b> : <code>RENDERER_API bool Renderer_DoSomething(const Foo* items, uint32_t count)</code> (<code>extern "C" __declspec(dllexport)</code>。名前は <code>DLL名_動詞</code>)</li>
  <li><b>C#</b> : <code>[DllImport(Dll, CallingConvention = CallingConvention.Cdecl)] public static extern bool Renderer_DoSomething(Foo* items, uint count);</code></li>
  <li>構造体は blittable (int / uint / float / IntPtr / 固定長の配列だけ) にし、<code>[StructLayout(LayoutKind.Sequential)]</code> で C++ と同じ並びにする。大きさを C++ の <code>static_assert(sizeof(...))</code> で確かめる</li>
  <li>物はハンドル (uint) でやり取りする。ポインタを C# に持たせない</li>
  <li>毎フレーム何度も呼ぶ物は配列でまとめて 1 回にする (P/Invoke は 1 回数十 ns)</li>
  <li>エンジンの利用者は NativeMethods を直接使わない。Engine / AssetManager / System から呼ぶ</li>
</ol>
<div class="note">C++ の RHI は、抽象クラス (<a href="#/t/RHI%3A%3AIRenderHardwareInterface">IRenderHardwareInterface</a>) と作る / 壊す関数だけを公開する (Public/rhi.h)。DirectX 12 の具象クラスは RHI.dll の外に出ない。</div>
</article>

<article data-id="asset" data-title="アセットの種類を足す">
<h2>アセットの種類を足す</h2>
<p>例 : SH4 のシェーダーグラフ (<code>.shadergraph.json</code>) を足した時に触った所。</p>
<ol class="steps">
  <li><a href="#/t/GameEngine.AssetKind">AssetKind</a> に値を足し、<a href="#/t/GameEngine.AssetDatabase">AssetDatabase</a>.<code>KindOf</code> で拡張子から決める。<code>.xxx.json</code> のような 2 つの拡張子は <code>SplitName</code> にも書く (名前を変える時に拡張子を残す)</li>
  <li>読む / 読み直す : <a href="#/t/GameEngine.AssetManager">AssetManager</a> (Model.cs) に <code>LoadXxx</code> / <code>ReloadXxx</code>。同じパスは同じ物を返す (キャッシュ)。名前が変わった時の付け替え (<code>onRenamed</code> の rekey) も</li>
  <li>エディター : <a href="#/t/GameEngine.Editor.ProjectPanel">ProjectPanel</a> のタイルの文字と色 (<code>builtInIcon</code>)、外で書き換えた時の読み直し (<code>reloadModified</code>)、作るボタン、ダブルクリック</li>
  <li>インスペクターの欄へドラッグで入れる : <code>ProjectPanel.AcceptDrop(AssetKind...)</code></li>
  <li>書き出し : <a href="#/t/GameEngine.Editor.AssetDependencies">AssetDependencies</a> が JSON の中の <code>{"guid": ...}</code> と <code>"Assets/..."</code> の文字を辿る。別の形なら walk を足す</li>
  <li><code>.gitignore</code> : Assets の <code>**/*.*</code> は外しているので、git に入れる種類は <code>!</code> の行を足す</li>
  <li>エディター拡張で済むなら <a href="#/t/GameEngine.Editor.AssetImporter">AssetImporter</a> (<code>[AssetImporter(".ext")]</code>) でも取り込める (エンジンを変えない)</li>
</ol>
</article>

<article data-id="editor" data-title="エディターを広げる">
<h2>エディターを広げる</h2>
<h3>ゲームのコードから (エンジンを変えない)</h3>
<p>Project/Scripts/Editor の例。エディターが読み込む時に <a href="#/t/GameEngine.Editor.EditorExtensions">EditorExtensions</a>.Scan が属性を探す。</p>
<pre><code>[EditorWindow("Game/Game Stats")]            // Window のメニュー
public sealed class GameStatsWindow : EditorWindow
{
    public override string Title =&gt; "Game Stats";
    public override void OnGUI()                // ImGui で描く
    {
        if (ImGui.Button("Stop all spins"))
            foreach (var e in World.Entities.Where(e =&gt; World.Has&lt;Spin&gt;(e)).ToList())
                EditorApi.Modify&lt;Spin&gt;(e, s =&gt; s with { DegreesPerSecond = 0 });   // 元に戻せる
    }
}

public static class GameMenu
{
    [MenuItem("Game/Create Spinning Box")] public static void CreateSpinningBox() { ... }
}

[CustomEditor(typeof(Spin))]                   // インスペクター / ギズモ
public sealed class SpinEditor : ComponentEditor&lt;Spin&gt; { ... }</code></pre>
<h3>エディターの本体に足す</h3>
<ul>
  <li>窓 : <a href="#/t/GameEngine.Editor.EditorApp">EditorApp</a> がフィールドで持ち、毎フレーム <code>Draw(ref bool open)</code> を呼ぶ (例 : <a href="#/t/GameEngine.Editor.BuildWindow">BuildWindow</a> / <a href="#/t/GameEngine.Editor.ShaderGraphWindow">ShaderGraphWindow</a>)。Window のメニューにも足す</li>
  <li>ショートカット : <code>EditorApp.handleShortcuts</code>。窓が自分で Ctrl+Z などを使うなら、その窓にフォーカスがある間は譲る (ShaderGraphWindow.HasFocus)</li>
  <li>元に戻す : シーンの変更は <a href="#/t/GameEngine.Editor.UndoStack">UndoStack</a> (<a href="#/t/GameEngine.Editor.ComponentEdit">ComponentEdit</a> / <a href="#/t/GameEngine.Editor.EntitiesEdit">EntitiesEdit</a> / <a href="#/t/GameEngine.Editor.CompoundEdit">CompoundEdit</a>)。アセットの変更は積まない</li>
  <li>テストから使う操作は public にして、ボタンと同じ道を通す (<a href="#/t/GameEngine.Editor.EditorTest">EditorTest</a> が呼ぶ)</li>
</ul>
</article>

<article data-id="shader" data-title="シェーダー / シェーダーグラフのノード">
<h2>自分のシェーダー / シェーダーグラフのノード</h2>
<h3>自分のシェーダー (.hlsl)</h3>
<pre><code>// @queue opaque | transparent      // @blend opaque | alpha | additive | premultiplied
// @cull back | front | none        // @zwrite on | off      // @depth test | read
// @param float   Speed 1 range(0, 4)
// @param color   Tint  (1, 0.5, 0.2, 1)
// @param texture Mask  white        // texture3d Volume builtin:PerlinWorley3D:64
float4 Surface(SurfaceInput IN)
{
    float3 albedo = ToLinear(Tint.rgb) * Mask.Sample(g_Sampler, IN.UV).rgb;
    return float4(Lit(albedo, IN.Normal, IN.WorldPosition, 0.0f, 0.5f), 1.0f);
}</code></pre>
<p><a href="#/t/GameEngine.ShaderAsset">ShaderAsset</a> がシーンのシェーダー (hlslTemplate.shader) の後ろに入力 / パラメーター / 関数 / エントリー (PSCustom) を書き足し、RHI が DXC でコンパイルする。エラーは「ファイル:行」。</p>
<h3>シェーダーグラフのノードを足す</h3>
<p><a href="#/t/GameEngine.ShaderGraph">ShaderGraph</a>.<code>buildLibrary</code> に 1 行足す。入力の式は型を合わせ済みで <code>c.In[i]</code> に来る。戻り値は出力の式。</p>
<pre><code>add("Posterize", "Math", "Posterize",
    new[] { P("In", D, "0.5"), P("Steps", F1, "4") },     // D = Dynamic (繋いだ物の大きさ)
    new[] { P("Out", D) },
    c =&gt; new[] { $"(floor({c.In[0]} * {c.In[1]}) / {c.In[1]})" },
    "Rounds to steps");</code></pre>
<ul>
  <li>一時の変数 : <code>c.Temp("float4", expr)</code> / 文 : <code>c.Line(...)</code> / マテリアルのパラメーター : <code>c.Parameter("float Name 1")</code> / エラー : <code>c.Fail("...")</code></li>
  <li>共通の HLSL の関数は <code>Helpers</code> に書く (名前は <code>_sg</code> で始める)</li>
  <li>EditorTest の「every node type generates HLSL that compiles」が全部のノードを 1 回でコンパイルして確かめる</li>
</ul>
</article>

<article data-id="camera" data-title="カメラ / 描画の設定 / マテリアル (v1.5)">
<h2>複数のカメラ / 描画の設定 / マテリアル (v1.5)</h2>
<h3>複数のカメラ (Unity と同じ)</h3>
<p>有効な <a href="#/t/GameEngine.Camera">Camera</a> + Transform を全部 (最大 8 台)、<code>Depth</code> の小さい順に描き、画面の <code>ViewportRect</code> の範囲に重ねる。一番小さい Depth のカメラがメインのカメラ (Volume / 音を聞く位置 / 影の距離の基準)。</p>
<table>
<tr><th>Camera の値</th><th>意味</th></tr>
<tr><td><code>Depth</code></td><td>描く順番 (大きい方が上に重なる)</td></tr>
<tr><td><code>ViewportRect</code></td><td>画面の範囲 (x, y, 幅, 高さ を 0〜1。x, y は<b>左下</b>が原点 = Unity と同じ)。投影はこの範囲の縦横の比で作る</td></tr>
<tr><td><code>ClearFlags</code></td><td>Skybox (空) / SolidColor (<code>BackgroundColor</code> の 1 色) / DepthOnly (消さない : 前のカメラの絵の上に、写った物だけを重ねる)</td></tr>
<tr><td><code>CullingMask</code></td><td>写すレイヤーのビット。物のレイヤーはエンティティの <code>EntityInfo.Layer</code> (インスペクターの名前の下の Layer。名前は Project Settings)</td></tr>
<tr><td><code>RenderPath</code> / <code>AntiAliasing</code> / <code>Ssao</code> / <code>Fxaa</code> / <code>Exposure</code> / <code>Tonemapper</code> / <code>Gamma</code></td><td>描き方 (カメラごと。以前はシーンの RenderSettings に 1 つだった)</td></tr>
</table>
<ul>
  <li>編集中のシーンビューはエディターのカメラ 1 台だけ (描き方は一番目のシーンのカメラの物)。再生するか「Game Camera」にすると、シーンのカメラが全部描かれる</li>
  <li>見本 : <code>Assets/Scenes/multicamera.scene.json</code> (メイン / 右上のミニマップ (Deferred・1 色の背景・レイヤー 8 の印) / 左下の小窓 (回る) / 重ねるカメラ (DepthOnly・レイヤー 9 の物だけ))</li>
</ul>
<h3>描く流れ (GraphicsSettings.RenderFrame)</h3>
<ol class="steps">
  <li><b>CameraSystem</b><small>カメラを Depth の順に並べて <code>Renderer_SetCameras</code> (変わった時だけ)。C++ は全部のカメラの行列と Culling Mask を RHI に持つ</small></li>
  <li><b>RenderSettingsSystem</b><small>メインのカメラの値と Project Settings の Rendering を、違う物だけ <a href="#/t/GameEngine.GraphicsSettings">Graphics</a> へ (キー / コードで変えた値は残る)。Volume は各カメラの位置で混ぜる</small></li>
  <li><b>カメラごとに</b><small>2 台目からは Graphics の値をそのカメラの物に入れ替え、<code>cmd.SetCamera(i)</code> (C++ が行列 / 定数を替え、GPU カリングをやり直す)。パイプラインはカメラごとに 1 つ (メインは <code>Graphics.Pipeline</code>)</small></li>
  <li><b>重ねる</b><small>画面全体で背景を消すカメラはバックバッファへ直接。範囲が一部 / DepthOnly のカメラは自分の絵 (RGBA8) に描き、<code>SetViewport</code> + <code>PSComposite</code> で範囲に重ねる (DepthOnly は乗算済みアルファ)</small></li>
</ol>
<p>自分のパイプラインは、最後の色を <code>settings.CameraTarget</code> へ描く (<code>Tonemap</code> はそうしている)。<code>settings.ClearFlags == DepthOnly</code> なら背景を描かず、透明 (0) のまま残す。</p>
<h3>Project Settings の Rendering (プロジェクト全体)</h3>
<p><a href="#/t/GameEngine.RenderingProjectValues">RenderingProjectValues</a> : 光の計算 (LightingModel) / 環境光 / 空の画像・明るさ・回転 / 影 / GPU パーティクル。全部のシーンで同じ値。シーンに置く RenderSettings の部品は無くした。</p>
<h3>1 Mesh / 1 Material (MeshRenderer.Materials)</h3>
<ul>
  <li><a href="#/t/GameEngine.MeshRenderer">MeshRenderer</a>.Materials[s] がサブメッシュ s のマテリアル (null / 足りない所はモデルに付いているマテリアル)</li>
  <li>エディターで Obj / Pmx / Fbx を置くと、<code>&lt;モデルのフォルダ&gt;/&lt;モデル名&gt;_Materials/&lt;材質名&gt;.material.json</code> をサブメッシュごとに作って入れる (<code>AssetManager.CreateModelMaterialAssets</code>。もうあるファイルは書き換えない)</li>
  <li>以前の <code>Material</code> (全部のサブメッシュに 1 つ) は読み込んだ時に Materials へ移る。マテリアルを物にドロップすると全部のサブメッシュに入る</li>
</ul>
<h3>物ごとの影 / シェーダーの雛形</h3>
<ul>
  <li><code>MeshRenderer.CastShadows</code> (切るとシャドーマップに描かない) / <code>ReceiveShadows</code> (切るとシャドーマップを読まない)。C++ の ObjectData.Info に印とレイヤーを入れ、GPU カリング (gpuCulling.shader) が影の視点 / Culling Mask で外す</li>
  <li>自分のシェーダーも何も書かずに効く (<code>Lit()</code> が見る)。Project の右クリック &gt; Create &gt; Shader &gt; Unlit Shader / PBR Shader で、書き方のヘルプ付きの雛形を作れる</li>
</ul>
</article>

<article data-id="ui" data-title="UI (Widget。v1.7)">
<h2>UI (Widget。v1.7)</h2>
<p>UE の UMG と同じ考え方。画面の UI は <b>Widget アセット</b> (<code>.widget.json</code>) に部品のツリーとして保存し、シーンの <a href="#/t/GameEngine.UIWidget">UIWidget</a> コンポーネント、またはコード (<a href="#/t/GameEngine.UI">UI</a>.CreateWidget) から使う。1 つの Widget アセットはいくつのシーンからでも使える (作るたびに別の <a href="#/t/GameEngine.UUserWidget">UUserWidget</a>)。</p>
<h3>しくみ</h3>
<ul>
  <li>部品は <a href="#/t/GameEngine.UWidget">UWidget</a> を継ぐクラス (名前は UE の C++ と同じく U 付き。WinForms の Button などとぶつからない)。子を持つ物は <a href="#/t/GameEngine.UPanelWidget">UPanelWidget</a>、親の中での置き方は <a href="#/t/GameEngine.UIPanelSlot">UIPanelSlot</a></li>
  <li>並べ方は Slate と同じ 2 回 : Prepass (子から欲しい大きさ) → Arrange (親が位置と大きさを決める。<code>Transform</code> = 自分の座標 → 画面のピクセル)。RenderTransform は描く時だけ</li>
  <li>大きさの単位は Widget アセットの基準の解像度 (既定 1920 x 1080)。画面の短い方の辺に合わせて拡大縮小する (<code>UIManager.ScaleFor</code>)</li>
  <li>描画は四角を <a href="#/t/GameEngine.UIDrawList">UIDrawList</a> に積み、Player では <code>Graphics.SubmitUI</code> (ImGui と同じ C++ の UI のパス。C++ は変えていない)、エディターでは ImGui の描画のリストに足す (シーンビューの絵の上 / Widget Designer の中)</li>
  <li>文字は System.Drawing でフォントを文字の表に描いて GPU へ (12〜128 px の決まった段。新しい文字はそのフレームの分を 1 枚の小さなテクスチャにする)。C++ に UI のテクスチャを消す API が無いので、作り直さないようにしている</li>
  <li>毎フレーム、ゲームの System の後 / エディターの GUI の前に <a href="#/t/GameEngine.UIManager">UIManager</a>.Update : UIWidget の反映 → 並べる → マウス / キー (再生中) → 描く</li>
</ul>
<h3>部品</h3>
<table>
<tr><th>Panel</th><td>CanvasPanel (Anchors / Offsets / Alignment / AutoSize / ZOrder) / HorizontalBox / VerticalBox (Auto / Fill + FillWeight) / Overlay / UniformGridPanel / ScrollBox / SizeBox / ScaleBox / Border / WidgetSwitcher</td></tr>
<tr><th>Common</th><td>TextBlock / Image / Button / ProgressBar / Spacer</td></tr>
<tr><th>Input</th><td>CheckBox / Slider / EditableTextBox</td></tr>
<tr><th>共通</th><td>Visibility (Visible / Collapsed / Hidden / HitTestInvisible / SelfHitTestInvisible) / IsEnabled / RenderOpacity / RenderTransform / Clipping</td></tr>
</table>
<h3>コードから</h3>
<pre><code>var hud = UI.CreateWidget("Assets/UI/HUD.widget.json");
hud.AddToViewport(10);                                   // 数の大きい物が手前
hud.GetWidget&lt;UTextBlock&gt;("Score")!.SetText("100");
hud.GetWidget&lt;UButton&gt;("Start")!.OnClicked += () =&gt; { };
hud.IsVisible = false;                                   // on / off
hud.SetZOrder(30);
hud.RemoveFromParent();
var fromScene = UI.GetWidget(entity);                    // シーンの UIWidget が出している物
if (UI.IsPointerOverUI) { /* ゲームのクリックを無視 */ }</code></pre>
<h3>エディター</h3>
<ul>
  <li>Project の右クリック &gt; Create &gt; Widget で作り、ダブルクリックで Widget Designer (Palette / Hierarchy / 画面 / Details)。変えると少し後に自動で保存</li>
  <li>シーンには UIWidget コンポーネント (Widget を Project から落とす)。再生中、ゲームのカメラの時だけシーンビューの上に出る (編集中は出さない)</li>
  <li>見本 : <code>Assets/Scenes/ui.scene.json</code> + <code>Scripts/UITest.cs</code> (1 / 2 / 3 / 4 / Z キーで on / off と重なり順)</li>
</ul>
<h3>部品を足す</h3>
<p>UWidget (子を持つなら UPanelWidget / UContentWidget) を継ぎ、<code>ComputeDesiredSize</code> / <code>ArrangeChildren</code> / <code>OnPaint</code> を書く。マウスを使うなら <code>HandlesPointer</code> と <code>OnMouseDown / Up / Drag</code>。保存されるのは public なフィールド。引数の無いコンストラクターを付け、ゲームの型なら <code>WidgetTypes.Register(typeof(...))</code> を呼ぶ。</p>
</article>

<article data-id="background" data-title="バックグラウンド / クラッシュレポート (v1.8)">
<h2>バックグラウンド / クラッシュレポート (v1.8)</h2>
<h3>後ろにある間は止める</h3>
<ul>
  <li><a href="#/t/GameEngine.Engine">Engine</a>.Run は、最小化中 / 他のアプリが前にある間、Update・物理・アニメーション・UI・描画・Present を全部しない。音は XAudio2 の StopEngine (<code>Audio_Suspend</code> / <code>Audio_Resume</code>)、パッドの振動も止める</li>
  <li>止めている間は <code>MsgWaitForMultipleObjectsEx</code> でメッセージが来るまで眠る (100 ms ごとにも見直す)。前に戻ると <code>Time.ResetFrameClock</code> で DeltaTime に止めていた時間を入れない (PlayTime も進まない)</li>
  <li>「前」の判定は前の窓のプロセス。同じプロセスの窓 (ファイルのダイアログ / 箱) が前にある時は止めない</li>
  <li><code>Engine.RunInBackground = true</code> で後ろでも動かす (最小化中は今まで通り止める)。Player は player.json の <code>RunInBackground</code> (Build Game の窓)、エディターは View &gt; Run In Background (exe の隣の editor_prefs.json)</li>
  <li>自動の確認 (<code>--editor-test</code> / <code>--quit-after</code> / Player の <code>--frames</code>) は常に動かす。止めた / 再開した時は <code>Engine.BackgroundChanged</code> と Console の <code>[Engine] Paused / Resumed</code></li>
</ul>
<h3>クラッシュレポート</h3>
<ul>
  <li>Main の最初に <a href="#/t/GameEngine.CrashReporter">CrashReporter</a>.Install(名前, 置き場)。<code>Crash_日時/</code> に report.txt (C# の例外の全文 / 版 / OS / CPU / メモリ / シーン / エンジンの様子 / 読み込んだ DLL)、crash.dmp (ミニダンプ)、native.txt (C++ で落ちた時 : 例外のコード / モジュール + オフセット / 関数と行)、log.txt (そのセッションのログ)。新しい 10 個だけ残す</li>
  <li>置き場 : Player は exe の隣の CrashReports (書けなければ %LOCALAPPDATA%)、エディター / ランチャーは <code>%LOCALAPPDATA%\Tsumugi Engine\CrashReports\&lt;名前&gt;</code></li>
  <li>受け取る所 : AppDomain.UnhandledException、WinForms のイベントの例外 (エディターは書いて続ける)、呼ぶ側の catch (<code>CrashReporter.Report</code>)、C++ は Core.dll の <code>Core/Source/Crash/crashHandler.cpp</code> (SetUnhandledExceptionFilter + ベクター例外ハンドラー。ダンプは先に作った別のスレッドが書く)</li>
  <li>C# から呼んだ C++ で落ちると .NET は FailFast で終わるので、ベクター例外ハンドラーで受け取る (落ちた所がネイティブの DLL の時だけ。C# の null 参照は除く)</li>
  <li>レポートに足したい情報は <code>CrashReporter.SetInfo("名前", 値)</code> (C++ で落ちた時の native.txt にも出る)</li>
  <li>確かめ方 : <code>--crash-test managed|native|thread|stackoverflow</code> (Player / エディター。10 フレーム後に落ちる)</li>
  <li>受け取れない物 : C# のスタックオーバーフロー、Environment.FailFast、各 DLL の CRT (/MT) の abort</li>
</ul>
</article>

<article data-id="scenes" data-title="シーンの管理 / サブシーン / 非同期 (v1.14 - v1.17)">
<h2>シーンの管理 / サブシーン / 非同期 (v1.14 - v1.17)</h2>
<p><a href="#/t/GameEngine.SceneManager">SceneManager</a> (<code>engine.Scenes</code> / <code>SceneManager.Current</code> / Behaviour の <code>Scenes</code>) が、読み込んだシーン (<a href="#/t/GameEngine.Scene">Scene</a>) を持つ。同期 (v1.14) と非同期 (v1.15) の両方で読める。見本 : <code>Assets/Scenes/scenes_demo.scene.json</code> + <code>Scripts/SceneLoadingDemo.cs</code> (N = ロード画面つきの非同期の切り替え / B = 同期 / 1・2 = サブシーン)。</p>
<h3>シーンの切り替え (Unity / UE と同じ)</h3>
<ul>
  <li><code>Scenes.LoadScene(path)</code> (Single) : 今のシーンを全部外してから読み、メインシーン (<code>ActiveScene</code>) にする。<code>LoadSceneMode.Additive</code> は足すだけ</li>
  <li><code>Scenes.DontDestroyOnLoad(entity)</code> : 永続シーン (<code>Scenes.Persistent</code>) へ移す。Transform の子 / 持っているサブシーンも一緒。Single で切り替えても残る</li>
  <li>コードで作った物 (SceneId 0) は今のメインシーンの物として扱う (切り替えると消える)</li>
  <li><code>Engine.LoadScene(path, additive)</code> は今まで通り (すぐ読み、作った物を返す)。中身は SceneManager</li>
  <li>外してもアセットは解放しない (次のシーンで使う物を読み直さない)。解放は <code>Scenes.UnloadUnusedAssets()</code></li>
</ul>
<h3>シーンの中のシーン (RE Engine と同じ)</h3>
<ul>
  <li><a href="#/t/GameEngine.SubScene">SubScene</a> コンポーネント (Scene = .scene.json / LoadOnStart / ActiveOnLoad) を付けたエンティティが「持ち主」</li>
  <li>状態 : 未ロード → 待機 (読んであるが無効) ⇔ 有効 → 未ロード。<code>LoadSubScene(owner)</code> / <code>SetSubSceneActive(owner, bool)</code> / <code>UnloadSubScene(owner)</code></li>
  <li>有効 / 待機の切り替えは印を変えるだけ (物とアセットは残る。すぐ効く)。持ち主を無効にする / 消すと、中の物も無効 / 外れる</li>
  <li>中の一番上の物 (親の無い Transform) は持ち主の子になる (持ち主を動かすと全部動く)</li>
  <li>入れ子にできる。自分を読む輪 (親のシーンと同じファイル) は読まずに Console に出す</li>
</ul>
<h3>非同期 (ロード画面)</h3>
<ul>
  <li><code>var op = Scenes.LoadSceneAsync(path)</code> / <code>Scenes.LoadSubSceneAsync(owner, active)</code> が <a href="#/t/GameEngine.SceneOperation">SceneOperation</a> を返す (Unity の AsyncOperation)。<code>Progress</code> (0〜0.9 = 読んでいる / 0.9 = 待っている / 1 = 終わった)、<code>IsReadyToActivate</code>、<code>AllowActivation</code> (false の間は切り替えない)、<code>Completed</code>、<code>await op</code> (続きはメインのスレッド)</li>
  <li>別のスレッド : ファイルを読む → JSON の解析 → 使うアセットのファイルを先に読む (OS のキャッシュに載せる)。メインのスレッド : フレームの頭で <code>Scenes.AsyncBudgetMs</code> (既定 4 ms) ずつ物を作る (アセットの GPU への転送はメインだけ)</li>
  <li>読み込み中のシーンの物は無効。有効にする時にまとめて有効になり、Single はその時に前のシーンを外す (それまで前のシーンは動く)。中の LoadOnStart のサブシーンも同じ Operation で読む</li>
  <li>取りやめ : 読み込み中のシーンを <code>UnloadScene</code> / 同期の Single / <code>World.Clear</code> / 持ち主を消す → <code>IsCancelled</code></li>
  <li>ロード画面の Widget は <code>UUserWidget.KeepOnSceneChange = true</code> で切り替えの瞬間も消えない (コードで作った他の Widget は、切り替えで今まで通り外れる)</li>
  <li>1 つの物は途中で止められない (<code>op.SlowestEntity</code> で一番重い物が分かる)。大きなモデルは v1.17 で別のスレッドへ (下)</li>
</ul>
<h3>モデルを別のスレッドで読む (v1.17)</h3>
<ul>
  <li>C++ : <code>Renderer_BeginLoadModel(path)</code> がワーカーで <b>.obj / .pmx の解析とテクスチャのデコード</b> を始め、<code>Renderer_FinishLoadModel(job, wait)</code> がメインスレッドで <b>GPU への登録</b> (頂点 / インデックス / テクスチャ / マテリアル) をする。<code>SceneRenderer::loadModelResource</code> は <code>prepareModel</code> (CPU) + <code>uploadModel</code> (GPU) に分けた (同期の <code>LoadModel</code> は今まで通り続けて呼ぶ)</li>
  <li>RHI : <code>DecodeTextures</code> (どのスレッドでも) / <code>CreateDecodedTextures</code> (メイン) / <code>ReleaseDecodedTextures</code>。<code>LoadTextures</code> はこの 2 つを続けて呼ぶ形にした (中身は同じ)。WIC のファクトリーは RHI の初期化 (メイン) で作る</li>
  <li>C# : <code>Assets.BeginLoadModel</code> / <code>IsModelLoading</code> / <code>FinishModelLoads(budgetMs)</code> / <code>PendingModelLoads</code>。<code>LoadModel</code> は読み込み中の物を頼まれたら終わるのを待って使う (2 回読まない)</li>
  <li>非同期のシーン : 解析の後、使う .obj / .pmx を別のスレッドで読み始め、全部終わってから物を作る (物を作る手は軽い)。<code>Scenes.Update</code> が毎フレーム終わった物を登録する (取りやめた読み込みの物も)</li>
  <li><code>SceneRenderer::Shutdown</code> は読み込み中の物を待ってから RHI を壊す</li>
  <li>FBX (C# で読む) と、同期の <code>LoadScene</code> は今まで通り (メインスレッド)</li>
</ul>
<h3>エディター (v1.16)</h3>
<ul>
  <li>Hierarchy : SubScene を持つ物に <code>[Sub Scene 名前 · 状態]</code>。中の物は紫で持ち主の下 (Transform の無い物も)。メインでない一番上のシーン (足したシーン / <code>DontDestroyOnLoad</code> / 読み込み中 <code>(loading 90%)</code>) は見出しの下にまとめる</li>
  <li>編集中は、サブシーンの中の物は見るだけ (メインシーンに保存されないため)。消す / 複製 / 親を変える / 名前 / ギズモ / Inspector を止め、Inspector に理由と「Open Its Scene」。再生中は触れる</li>
  <li>持ち主の右クリック &gt; Sub Scene : Load / Unload / Activate / Standby / Open。Inspector の SubScene の下にも状態とボタン</li>
  <li>Project の .scene.json を Hierarchy へドラッグ : SubScene を持つ物を作って読む (元に戻せる。開いているシーン自身は置けない)</li>
  <li>持ち主を消す / 複製する時、中の物は入れない (<code>EditorWorld.WithDescendants</code> は別のシーンの子を飛ばす)。元に戻す / やり直す / 複製の後と、SubScene.Scene を変えた時は読み直す。シーンのアセットの名前を変えると SubScene.Scene も付け替える</li>
  <li>Build Game : シーンの JSON の "Assets/..." を辿るので、サブシーンのファイルも入る</li>
</ul>
<h3>仕組み</h3>
<ul>
  <li>どのシーンの物かは <code>EntityInfo.SceneId</code> (internal。保存しない)。World はシーンごとの印 (無効 / メインでない) を持ち、<code>TransformSystem</code> が「自分の Active かつシーンが有効」と親から、<code>World.IsActive</code> を決める</li>
  <li>ゲームのコード (Update / FixedUpdate / LateUpdate / 衝突 / UI のイベント) の中で頼んだ読み込み / 外すは、次のフレームの頭 (<code>Scenes.Update</code>。全部の System の前) で行う。戻り値の Scene は <code>State = Loading</code>、読み終わると <code>Loaded</code> と <code>SceneLoaded</code></li>
  <li>メインシーンを保存する時 (<code>SceneSerializer.Save(world)</code>) は、メインでないシーン (サブシーン / 足したシーン / 永続) の物は書かない</li>
  <li>読み込みは <code>SceneSerializer.SceneLoader</code> (Parse = 別のスレッドで呼べる / Step = 1 つずつ)。同期の Load もこれを最後まで回すので、非同期でも作る物と順番は同じ</li>
  <li>エディター : 停止 / スクリプトの読み直しで JSON から世界を作り直した後、<code>LoadStartSubScenes(開いているシーン)</code> でサブシーンを読み直す</li>
  <li>確認 : <code>--editor-test --editor-test-section scenes</code> (速さ : <code>scenes-bench-sync</code> / <code>scenes-bench-async</code>、目で見る : <code>scenes-demo-hold</code>)。テストでキーを押す : <code>Input.SimulateKeyPress</code></li>
</ul>
</article>

<article data-id="gameobject" data-title="GameObject / 物を探す / タグ / 物とアセットの欄 (v1.18 - v1.21)">
<h2>GameObject / 物を探す / タグ / 物とアセットの欄 (v1.18 - v1.21)</h2>
<p><a href="#/t/GameEngine.GameObject">GameObject</a> は Unity の GameObject に当たる窓口。中身は World と Entity だけの小さな struct で、データはこれまで通り World のコンポーネント。<code>Entity</code> と暗黙に行き来できる。</p>
<p>見本 (v1.21) : <code>Assets/Scenes/objects_demo.scene.json</code> + <code>Scripts/ObjectsDemo.cs</code>。砲台 (Turret) の <code>Target</code> (ComponentRef&lt;Enemy&gt;) / <code>Muzzle</code> (GameObject) / <code>Bullet</code> (Prefab) / <code>Next</code> (SceneReference) を Inspector で入れてあり、再生すると狙った敵へプレハブの弾を撃ち、倒すと <code>FindObjectsOfType&lt;Enemy&gt;()</code> で次の敵を探す。N で Next のシーンへ。</p>
<pre><code>var player = GameObject.Find("Player");                   // 名前 (有効な物だけ)
if (player) player.Transform.Position += Vector3.UnitY;   // 中身があるか (消えたら false)
var hand  = GameObject.Find("Body/Arm/Hand");             // 親子のパス (先頭が / なら一番上の物から)
var enemy = GameObject.FindWithTag("Enemy");
foreach (var e in GameObject.FindGameObjectsWithTag("Enemy")) { ... }
var cam   = GameObject.FindObjectOfType&lt;Camera&gt;();       // その型を持つ最初の物</code></pre>
<h3>探す (World / Behaviour / GameObject の static)</h3>
<ul>
  <li><code>world.Find(nameOrPath)</code> / <code>FindAll(name, list)</code> / <code>FindWithTag</code> / <code>FindAllWithTag(tag, list)</code> / <code>FindById(guid)</code> / <code>FindObjectOfType&lt;T&gt;()</code> / <code>FindObjectsOfType&lt;T&gt;(list)</code>。どれも <code>includeInactive</code> を付けると無効な物も返す (既定は Unity と同じく有効な物だけ)</li>
  <li>Behaviour の中は <code>Find</code> / <code>FindWithTag</code> / <code>FindGameObjectsWithTag</code> / <code>FindObjectOfType&lt;U&gt;</code>、今の物は <code>GameObject</code> (Unity の gameObject)</li>
  <li><code>GameObject.Find</code> など static の物は今のエンジン (<code>SceneManager.Current</code>) の World を探す</li>
  <li>速さ : 名前 / タグ / Id は World の索引 (辞書) で引く。1 万個の物で 1 回 0.2 µs (順に見ると 15 µs)。索引を作った後は、物を作る + 消すが 1 個 0.4 µs ほど増える。索引は最初に探した時に作り、その後は物を作る / 消す / EntityInfo を置き換える度に直す (一度も探さないゲームには手間がかからない)</li>
  <li>名前 / タグは <code>GameObject.Name</code> / <code>Tag</code> か <code>world.SetName</code> / <code>SetTag</code> で変える。<code>ref EntityInfo</code> で直接書き換えた時は <code>world.Reindex(entity)</code> (呼ばなくても、古い名前で間違った物は返さない)</li>
  <li>同じ名前が何個もある時は、シーンの中で前の物 (索引に入った順)</li>
</ul>
<h3>GameObject</h3>
<ul>
  <li><code>Name</code> / <code>Tag</code> / <code>CompareTag</code> / <code>Layer</code> / <code>ActiveSelf</code> / <code>ActiveInHierarchy</code> / <code>SetActive</code></li>
  <li><code>ref Transform</code> / <code>ref GetComponent&lt;T&gt;()</code> / <code>TryGetComponent</code> / <code>HasComponent</code> / <code>ref AddComponent(value)</code> / <code>RemoveComponent&lt;T&gt;()</code></li>
  <li><code>Parent</code> / <code>GetChildren()</code> / <code>FindChild("子/孫")</code> (Unity の transform.Find) / <code>Destroy()</code> (すぐ消す。Update の中は Behaviour の <code>Destroy(gameObject)</code>)</li>
  <li>コンポーネントのフィールドにも書ける (<code>public GameObject Target;</code>)。保存すると相手の Id (Entity と同じ)。Inspector では物の欄 (下)</li>
</ul>
<h3>Inspector の物の欄 (v1.19。Unity の ObjectField)</h3>
<ul>
  <li><code>Entity</code> / <code>GameObject</code> のフィールドは <code>[ 名前 (GameObject) ][...]</code> の欄。何も無ければ None、消えた物を指していれば赤い Missing</li>
  <li>Hierarchy の行を欄へドラッグして入れる。Hierarchy でドラッグを始めると、押した時に変わった選択は元に戻る (Inspector が欄の持ち主のまま。v1.19 から)</li>
  <li>欄をクリック : Hierarchy のその物を光らせる (Ping。親を開いてスクロール、1.5 秒)。ダブルクリック : 選ぶ。右クリック : Ping / Select / Clear</li>
  <li><code>[...]</code> : 選ぶ窓。名前の一部 (大文字小文字を問わない) / <code>t:Camera</code> (その型を持つ物) / <code>tag:Enemy</code> で絞る。見えている行だけを描くので物が多くても重くならない。親の名前も出す</li>
  <li>編集中は別のシーンの物 (足したシーン / サブシーンの中 ⇔ メインシーン) を入れられない (保存すると読み込みの順で外れるため。Unity と同じ)。理由をツールチップに出す。再生中はどの物でも入れられる (保存しない)</li>
  <li>配列 (<code>GameObject[]</code> など) の要素も同じ欄。変更は元に戻せる</li>
</ul>
<h3>コンポーネントとアセットへの参照 (v1.20)</h3>
<pre><code>public struct Turret : IComponent
{
    public ComponentRef&lt;Rigidbody&gt; Body;   // Rigidbody を持つ物だけ入れられる
    public Prefab? Bullet;                  // .prefab.json
    public SceneReference Next;             // .scene.json
}
if (t.Body) t.Body.Value.Velocity = Vector3.Zero;           // Value は T への参照
if (t.Bullet != null) t.Bullet.Instantiate(World, Transform.Position);
if (t.Next) Scenes.LoadScene(t.Next);                        // LoadSceneAsync にも渡せる</code></pre>
<ul>
  <li><a href="#/t/GameEngine.ComponentRef&lt;&gt;">ComponentRef&lt;T&gt;</a> : 「T を持つ物」への参照。<code>IsValid</code> (生きていて T を持つ) / <code>ref Value</code> / <code>TryGet</code> / <code>GameObject</code>。保存は相手の Id。Inspector の欄は T を持つ物だけを受け付け (落としても断る / 選ぶ窓も T を持つ物だけ)、相手が T を外すと赤で <code>名前 (no T)</code>。<code>gameObject.GetComponentRef&lt;T&gt;()</code> でも作れる</li>
  <li>型引数を知らずに扱う口は <code>IEntityRef</code> / <code>EntityRefs.Create</code> (保存と Inspector はこれを使い、ゲームの型で MakeGenericMethod をしない)</li>
  <li><code>Prefab</code> のフィールド : 保存は他のアセットと同じ <code>{ "guid", "path" }</code>。読む時に <code>Assets.LoadPrefab</code></li>
  <li><a href="#/t/GameEngine.SceneReference">SceneReference</a> : シーンのパスとアセットの Id。Id から今のパスを引くので、シーンの名前を変えても / 動かしても辿れる。シーンは読み込まない (LoadScene に渡した時に読む)。Build Game はパスを辿ってシーンのファイルも入れる</li>
  <li>Inspector のアセットの欄は表 (型 → アセットの種類 / パス / 読み方) で描く。パスを書いて Enter / Project から落とす (以前と同じ) / <code>[...]</code> = その種類のアセットの選ぶ窓 (名前・パスで検索)。空の時は <code>None (型)</code></li>
</ul>
<h3>タグ</h3>
<ul>
  <li><code>EntityInfo.Tag</code> (string。null = Untagged)。Inspector の名前の下、Layer の横で選ぶ。候補は Project Settings の <code>TagNames</code> (コードからは一覧に無い名前も使える)</li>
  <li>シーンには <code>"tag"</code> として書く (Untagged は書かない。前のファイルはそのまま読める)</li>
  <li>確認 : <code>--editor-test --editor-test-section objects</code> (速さ : <code>objects-bench</code> = 探す、<code>objects-picker-bench</code> = 選ぶ窓。撮影用 : <code>objects-view</code>)。Build Game の確認は見本のシーンも書き出して、参照が戻るか / エディターの再生と同じに動くかを比べる</li>
  <li>速さ (1 万個の物) : 選ぶ窓を開いてもフレームの時間は増えない (見えている行だけ描く)。一覧を作るのは開いた時と検索を変えた時だけで 0.3 ms</li>
</ul>
</article>

<article data-id="userdata" data-title="UserData / 設定のファイル (v2.0。Unity の ScriptableObject)">
<h2>UserData / 設定のファイル (v2.0。Unity の ScriptableObject / RE Engine の UserData)</h2>
<p>エディターを使う人が自分で型を決められる「設定のファイル」(<code>名前.userdata.json</code>)。敵の種類 / 出てくる順の表 / 調整の値などを、シーンとは別のアセットにして、いくつもの物・シーンから同じ物を使う。</p>
<pre><code>[UserData(Menu = "Samples/Enemy Type", FileName = "New Enemy Type")]   // Create &gt; UserData の下の名前 / 作る時のファイルの名前
public sealed class EnemyType : UserData
{
    public string DisplayName = "Enemy";
    public Prefab? Body;                       // アセット (プレハブ / モデル / 音 / マテリアル ...)
    [Range(1, 50)] public int Hp = 3;
    public List&lt;Wave&gt; Waves = new();           // リスト / 入れ子の struct / [Serializable] なクラス
    public EnemyType? Next;                    // 別の UserData (自分を指しても良い)
    protected override void OnValidate() { if (Hp &lt; 1) Hp = 1; }   // Inspector で変えた後
}
public struct Spawner : IComponent { public EnemyType? Type; }   // コンポーネントの欄 (同じ型のファイルだけ選べる)
var type = engine.Assets.LoadUserData&lt;EnemyType&gt;("Assets/Data/Slime.userdata.json");</code></pre>
<h3>決まり</h3>
<ul>
  <li><a href="#/t/GameEngine.UserData">UserData</a> を継いだ public で abstract でないクラス (引数なしのコンストラクター)。登録は要らない (ComponentRegistry と同じく読み込み済みのアセンブリから探す)</li>
  <li>保存するフィールドはコンポーネントと同じ (public か [SerializeField]。readonly / [NonSerialized] / プロパティは保存しない)。[Range] / [Header] / [Tooltip] / [HideInInspector] も効く</li>
  <li>書ける値 : 数 / bool / string / enum / Vector / Quaternion / List・配列 / 入れ子の struct / <b>[Serializable] なクラス (UserData の中だけ。10 段まで)</b> / アセット / 別の UserData</li>
  <li><b>シーンの物 (Entity / GameObject / ComponentRef&lt;T&gt;) は持てない</b> (Unity / RE Engine と同じ。アセットはシーンの外にあるので)。書くと null、Inspector では灰色で触れない。物を作る元はプレハブで持つ</li>
  <li>同じパスは同じインスタンス (<code>AssetManager.LoadUserData</code>)。1 つのファイルを直すと、使っている物が全部変わる。<code>Version</code> / <code>Changed</code> で変わったことが分かる</li>
  <li>型に無い値 (フィールドの名前を変えた / 消した) はファイルに残し、保存する時に書き戻す (<code>UnknownValueNames</code>)</li>
  <li>ファイル : <code>{"format": "GameEngineUserData", "version": 1, "type": "名前空間.型", "values": {...}}</code>。アセットは <code>{guid, path}</code></li>
</ul>
<h3>エディター</h3>
<ul>
  <li>Project の右クリック &gt; Create &gt; UserData &gt; (Menu の名前)。ゲームのコードを書くと増える</li>
  <li>Project で選ぶと Inspector に出る。触り終わるとファイルに書き、<code>OnValidate</code> を呼ぶ。Ctrl+Z で戻せる (シーンの「保存していない変更」にはならない)</li>
  <li>再生中に変えた値 (ゲームのコード / Inspector) はファイルに書かず、Stop でファイルの値に戻る (<code>AssetManager.RevertUserData</code>)</li>
  <li>型が見つからない時 (ビルドの失敗など) は理由とファイルの中身を見せるだけ (書き換えない)。ゲームのコードを読み直すと、古い型のインスタンスは捨てて新しい型で作り直す (<code>ForgetUserData</code>)</li>
</ul>
<h3>書き出したゲーム (.userdata.bin)</h3>
<ul>
  <li>Build Game は <code>.userdata.json</code> を <a href="#/t/GameEngine.UserDataBinary">UserDataBinary</a> の形の <code>.userdata.bin</code> にして書く (<code>.userdata.json</code> は入らない)。ゲームのコード / シーンのパスは <code>.userdata.json</code> のままで良い (AssetManager が隣の .bin を読む)</li>
  <li>形 : 値の木を bin にし (名前と文字列は 1 回だけの表、整数は可変長、float は 4 byte) → Brotli → 鍵の流れで混ぜる → HMAC-SHA256。1 byte でも書き換えると読まない (シーンの警告に「modified」と出て、そのフィールドは空)</li>
  <li>型を知らなくても読み書きできる形 (JSON の木と同じ) なので、型を変えても前の値を失わない。※鍵は Player の中にある (Data.pak と同じ)。本気で解析すれば読めるが、開いて値を書き換えることはできない</li>
  <li>大きさ : 見本の 3 ファイル 1409 → 741 byte (見出し 68 byte を含む)、2000 行の表 139810 → 4831 byte (3.5 %)。読むのは 2000 行で 1.8 ms</li>
</ul>
<p>見本 (v2.0) : <code>Assets/Scenes/userdata_demo.scene.json</code> + <code>Scripts/UserDataDemo.cs</code> + <code>Assets/Samples/UserData</code>。<code>EnemyType</code> (スライム / ゴーレム) と <code>WaveTable</code> (Stage1) を UserData で作り、Spawner が表の順に、EnemyType の Body (プレハブ) から Hp / Speed / Scale の敵を出す。</p>
<p>確認 : <code>--editor-test --editor-test-section userdata</code> (撮影用 <code>userdata-view</code>、書き出し <code>userdata-build</code>、速さ <code>userdata-bench</code>)</p>
</article>

<article data-id="layouts" data-title="窓の並びのプリセット / 前に開いていたシーン (v2.1)">
<h2>窓の並びのプリセット / 前に開いていたシーン (v2.1)</h2>
<h3>窓の並びのプリセット (View &gt; Layout)</h3>
<ul>
  <li><b>Default</b> (既定の並び。消せない) と、自分で登録した並び <b>5 つまで</b>。メニューで選ぶと、その並び (窓の位置 / 大きさ / docking) と「どの窓を出すか」に戻る</li>
  <li><b>Save Layout...</b> / <b>Manage Layouts...</b> で Layouts の窓 : 今の並びを名前を付けて登録 (Save As New)、Load / Overwrite (今の並びで上書き) / Rename / Delete (2 回押す) / 上下で並べ替え</li>
  <li>名前は自由 (日本語も可、32 文字まで)。前後の空白は取る。空 / 同じ名前 (大文字小文字を区別しない) / "Default" は断る</li>
  <li>中身 = ImGui の ini (<code>ImGui.SaveIniSettingsToMemory</code>) + ini に入らない窓を出すかの印 (Hierarchy / Inspector / Console / Project / Profiler / CPU / GPU / Rendering Stats / Memory / Render Graph Viewer / Frame Debugger)。読むのは次のフレームの頭 (<code>ImGuiBackend.LoadLayout</code> → NewFrame の前に <code>LoadIniSettingsFromMemory</code>。ImGui はフレームの途中では ini を読めない)</li>
  <li>置き場 : <code>%LOCALAPPDATA%\Tsumugi Engine\Editor\layouts.json</code> (プロジェクトにもエディターの版にも依らない。Package のエディターのフォルダは版を上げると消えるので exe の隣に置かない)。コードは <code>LayoutPresets.cs</code> / <code>EditorApp.Layouts.cs</code></li>
  <li>View &gt; Reset Layout は Default と同じ (以前は窓の出す / 出さないは戻らなかった)</li>
</ul>
<h3>前に開いていたシーン</h3>
<ul>
  <li>シーンを開く / 保存する / 名前を変えると、プロジェクトの <code>Library/EditorState.json</code> (<code>{"LastScene": "Assets/..."}</code>。Library は git に入れない) に覚える</li>
  <li>次にエディターを開いた時 (ランチャーから <code>--project</code> で開いた時も)、<code>--scene</code> が無ければそのシーンを開く。無い / Assets の外 / 壊れたファイルなら、今まで通り showcase → Scenes の最初のシーン</li>
  <li><code>--editor-test</code> / <code>--quit-after</code> では覚えない・読まない (リポジトリの Project の次の起動を変えないため)</li>
</ul>
<h3>直したこと : Behaviour があると動いた物が描画されない</h3>
<p>Behaviour&lt;T&gt; は全部 ILateSystem なので、1 つでもあると Engine.Run は LateUpdate の後に Transform を計算し直す。以前はそこで <code>TransformSystem.Update</code> を呼び、Update / 物理で立てた <code>Transform.Changed</code> を下ろしていたため、RenderSyncSystem が何も送らなかった。今は <code>UpdateAgain</code> (Changed を下ろさない)。</p>
<p>確認 : <code>--editor-test --editor-test-section layouts</code></p>
</article>

<article data-id="locallights" data-title="点光源 / スポットライト / クラスター / スプラッシュ画面 / シーンビューの表示モード (v2.2)">
<h2>点光源 / スポットライト / クラスター / スプラッシュ画面 / シーンビューの表示モード (v2.2)</h2>
<h3>コンポーネント (UE の Point Light / Spot Light と同じ項目)</h3>
<ul>
  <li><code>PointLight</code> : Color / Intensity / Range (UE の Attenuation Radius) / SourceRadius / UseInverseSquaredFalloff / FalloffExponent / CastShadows (既定 off。v2.2 より前のシーンの見た目を変えない) / ShadowBias</li>
  <li><code>SpotLight</code> (新規) : 上と同じ + InnerConeAngle / OuterConeAngle (中心からの半分の角度。既定 0 / 44 度。外側は 1〜80 度)。向きは Transform の Forward (+Z)。CastShadows は既定 on</li>
  <li>減衰 : <code>localAttenuation</code> (hlslTemplate.shader)。Inverse Squared = <code>(1 - (d/r)⁴)² / (d² + 1)</code> (以前の点光源と同じ) / 切ると <code>(1 - (d/r)²)^FalloffExponent</code>。円錐 = <code>saturate(L・D × SpotScale + SpotOffset)²</code></li>
  <li>SourceRadius : 鏡面反射だけ、反射の向きに一番近い球の上の点から光が来るとして計算し (Karis 2013 の Representative Point)、粗さを広げた分の明るさを下げる</li>
  <li>エディター : GameObject &gt; Light (Directional / Point / Spot)。シーンビューに全部のライトの印 (クリックで選べる)、選んだライトの範囲 (球 / 円錐 / 矢印)。コードは <code>EditorApp.Lights.cs</code></li>
</ul>
<h3>C++ への渡し方</h3>
<ul>
  <li><code>RHI::LightData</code> は 80 byte (以前 48)。並びは 平行光源 → 点光源 → スポット (<code>LightSystem</code>)。C# の <code>NativeMethods.LightData</code> / HLSL の <code>struct LightData</code> も同じ並び</li>
  <li><code>RHI::LightingSettings</code> は 32 byte (Flags : <code>LIGHTING_FLAG_CLUSTERED</code>)、<code>RHI::ShadowSettings</code> は 64 byte (LocalShadowMap / LocalSoftness / LocalSliceCount)。構造体を変えたら RHI と Renderer を Debug / Release の両方でビルドし直す (古い Renderer.dll は 16 byte しか写さない)</li>
</ul>
<h3>点光源 / スポットライトの影</h3>
<ul>
  <li>Depth32 の配列 1 つ (<code>ShadowPass</code> の Local Shadow Map。使う枚数に合わせて 6 枚単位で増やす)。スポット = 1 枚 (外側の角度の透視投影) / 点光源 = 6 枚 (+X −X +Y −Y +Z −Z。90 度 + 縁の余白)</li>
  <li>割り当て : <code>LightSystem</code> が CastShadows のライトを「カメラから届く球の端までの距離」の近い順に並べ、Project Settings &gt; Rendering &gt; Local Lights &gt; Max Shadow Slices (既定 12、最大 24) に入る物から <code>LightData.ShadowIndex</code> を付ける。入らないライトは光だけ</li>
  <li>視点の番号 : <code>1 + MAX_SHADOW_CASCADES + 枚</code> (<code>RHI::LOCAL_SHADOW_VIEW_BEGIN</code>)。行列は C++ (<code>Buffer::computeLocalShadowViews</code>) が作り、シェーダー (<code>localShadow</code>) は行列を受け取らず LightData から同じ向き・投影を作り直す (両方の上の向き / Near / Far をそろえること)</li>
  <li>カリング : スポットは透視の視錐台、点光源の 6 面はライトを囲む箱で 1 回 (<code>Buffer::GetShadowCullPlanes</code> の key が同じ視点は数え直さない)。カメラが何台でも 1 フレームに 1 回だけ描く</li>
</ul>
<h3>クラスター (Clustered shading)</h3>
<ul>
  <li>画面を 16 x 9 の区画 × 奥行き 24 段 (対数) に分け、各段に届く点光源 / スポットの番号を並べる。作るのは CPU (<code>Buffer::buildClusters</code>。球を画面に映した範囲 : Mara &amp; McGuire 2013)。フレームの始めに全部のカメラの分を VRAM へ写す (<code>Buffer::WriteClusters</code>。カメラ / ライトが変わった枠だけ)</li>
  <li>ルートシグネチャ [9] = t6 (<code>StructuredBuffer&lt;uint&gt; g_Clusters</code>。段ごとの <code>先頭 | 数 &lt;&lt; 20</code> + 番号の並び)。ピクセルシェーダーは平行光源 (先頭の <code>g_DirectionalCount</code> 個) をいつも回し、残りは自分の段の一覧だけ</li>
  <li>切り替え : Project Settings &gt; Rendering &gt; Local Lights &gt; Clustered (<code>Graphics.LocalLights.Clustered</code>)。平行投影のカメラは使わない (全部のライトを回す)</li>
  <li>計測 (RTX 2070 / Release / 1280x720 / <code>--light-bench N</code>、GPU の描画パスの合計) : 8 個 0.383 → 0.300 ms / 64 個 1.276 → 0.419 ms / 256 個 4.386 → 0.935 ms。見本のシーン (点光源 2) は 0.68 → 0.69 ms (ほぼ同じ)</li>
</ul>
<h3>スプラッシュ画面</h3>
<ul>
  <li>エディターの起動中、別のスレッド (STA) の枠なしの窓に 段階 / 経過時間 / 進み具合 / 最後のログの行 を出す (<code>SplashScreen.cs</code>)。メインのスレッドがビルドなどで止まっていても動き続ける</li>
  <li>エディターの窓は <code>EngineSettings.ShowWindow = false</code> で隠したまま作り、最初のフレームを描き終えてから出す (<code>Engine.WindowShown</code>)。隠している間は後ろにあっても止めない (止めると最初のフレームを描かず、いつまでも出ない)</li>
  <li>出さない : <code>--editor-test</code> / <code>--quit-after</code> / <code>--resave-scenes</code> / <code>--no-splash</code></li>
</ul>
<h3>Package : 前の版のエディターを残す</h3>
<p><code>Tools/make_package.py</code> は今の版の <code>Editor/&lt;名前&gt;_v&lt;版&gt;</code> だけを作り直し、前の版のフォルダは残す (前の版で作り始めたゲームを、その版で開き続けられるように)。ランチャーの版の選択に全部の版が出る。</p>
<h3>シーンビューの表示モード (View のプルダウン)</h3>
<ul>
  <li>シーンビューのツールバーの <b>View : Default ▼</b>。選んだモードはメインのカメラ (シーンビュー) の描画だけを変える (<code>Graphics.ViewPipelineOverride</code>。ゲームのカメラ / 書き出したゲームには関係しない)。コードは <code>SceneViewModes.cs</code></li>
  <li><b>Default</b> : 普段の描画</li>
  <li><b>DrawMap</b> : 描画の負荷の推定を 青 → 水色 → 緑 → 黄 → 赤 で出す (凡例と目盛りつき)。Metric = Combined (重なり × (1 + ライトの数 × 重み)) / Overdraw (塗った面の数。<code>ScenePass.Overdraw</code> で深度を見ずに 1 を加算) / Lights (一番手前の面に実際に届くライトの数。クラスターを使う)。シェーダーは <code>hlslTemplate.shader</code> の <code>PSDrawMap</code>。GPU の実測ではない (UE の Shader Complexity と同じ考え方)。自分のシェーダーの物 / パーティクルは数えない</li>
  <li><b>CollisionMap</b> : 普段の物を描かず、コライダーの形だけを塗りつぶしで描く (<code>Physics.ShowCollidersSolid</code> → <code>CollisionSystem.drawCollidersSolid</code> が <code>DebugDraw.SolidBox / SolidSphere / SolidCapsule / Triangle</code> を足し、パイプラインが <code>RenderCommandBuffer.DrawDebugTriangles</code> で深度つきで描く)。メッシュのコライダーは三角形そのまま (<code>CollisionMesh</code> が形を持つ)。色は状態 (動かない / 剛体 / 眠っている / 重なっている / トリガー (半透明) / アセットの部品) か、Color by layer でレイヤー</li>
  <li>CollisionMap の <b>Style</b> : Solid (塗りつぶし) / Wireframe (辺だけ。深度を書かないので裏の辺も透けて見える) / Solid + Wireframe (塗りつぶし + 暗くした辺。隠れた辺は出ない)。<code>cmd.DrawDebugTriangles(wireframe: true, brightness)</code> = <code>FillMode WIREFRAME</code> の PSO (少し手前へずらし、深度は書かない。debug.shader の <code>PSDebugWire</code>)</li>
  <li>C++ : <code>RHI::ScenePass::Overdraw</code> (加算・深度なしの PSO)、<code>RenderCommandType::DrawDebugTriangles</code> と <code>Renderer_SetDebugTriangles</code> (今の描画先の形式ごとの PSO。debug.shader の <code>VSDebugTriangle / PSDebugTriangle</code>。面の向きは位置の ddx / ddy から)</li>
</ul>
<h3>プロジェクトごとに表示モードを足す</h3>
<pre>// Project/Scripts/Editor/*.cs (GameEditor.csproj)。保存するとエディターが読み直す
[SceneViewMode("Unlit (Albedo)", 200)]
public sealed class UnlitViewMode : SceneViewMode
{
    private LightingModel _saved;
    public override void OnEnable()  { _saved = Engine.Graphics.LightingModel; Engine.Graphics.LightingModel = LightingModel.Unlit; }
    public override void OnDisable() =&gt; Engine.Graphics.LightingModel = _saved;
}</pre>
<ul>
  <li>上書きできる所 : <code>CreatePipeline()</code> (自分の <code>RenderPipeline</code> で描く。選んだ時に作り、外す時に Dispose) / <code>OnEnable</code>・<code>OnDisable</code> (設定を変えて戻す) / <code>OnUpdate</code> (毎フレーム。DebugDraw で足す) / <code>OnOptionsGUI</code> (プルダウンの中) / <code>OnOverlayGUI</code> (絵の上。<code>DrawLegend</code> で凡例)</li>
  <li>見本 : SampleProject の <code>Scripts/Editor/SampleViewModes.cs</code> (Unlit (Albedo) / Light Ranges)。組み込みと同じ名前は断る。例外はコンソールに出して Default に戻す</li>
  <li>ゲームのコードを読み直す時は、プロジェクトのモードを一度外し (<code>EditorExtensions.BeforeClear</code>)、読み直した後に同じ名前のモードへ戻す (古い GameEditor.dll を持ち続けない)</li>
  <li>起動時に選ぶ : <code>GameEngine.Editor.exe --view-mode DrawMap</code></li>
</ul>
<p>確認 : <code>--editor-test --editor-test-section lights</code> / <code>--editor-test-section viewmodes</code> / 見本 <code>GameEngine_console --scene lights</code> (<code>--view spot</code> / <code>--small-lights off</code>)、計測 <code>--light-bench N --clustered on|off</code> / <code>--gpu-stats on</code></p>
</article>

<article data-id="imaging" data-title="画像エディター / GameEngine.Imaging (v2.3)">
<h2>画像エディター / GameEngine.Imaging (v2.3)</h2>
<p class="lead">Project の画像 (.png / .jpg / .jpeg / .bmp / .tga) をダブルクリックすると画像エディターの窓が開く。処理は別のアセンブリ <code>GameEngine.Imaging</code> (エンジン / ImGui に依存しない) にあり、表示と操作だけがエディター (<code>GameEngine.Editor/ImageEditor</code>) にある</p>
<h3>GameEngine.Imaging (外へ持ち出せる)</h3>
<ul>
  <li><code>ImageBuffer</code> : float の RGBA (0〜1。ファイルの値のまま = ガンマ空間)。<code>FromRgba8</code> / <code>ToRgba8</code> / <code>DownscaleToFit</code> / <code>Resize</code></li>
  <li><code>Codecs.ImageCodec</code> : <code>Load</code> / <code>Save</code> / <code>Decode</code> / <code>Encode</code>。全部自前 (外部のライブラリ / System.Drawing は使わない)。壊れたデータは <code>ImageFormatException</code>
    <ul>
      <li>PNG : 全カラー型・1〜16bit・Adam7・tRNS。書き出しは 8bit RGB / RGBA (自前の Deflate : <code>Codecs.Zlib</code>)。zlib を戻すのは Runtime の <code>Inflate.cs</code> をリンクで取り込む (<code>GAMEENGINE_IMAGING</code> の時は internal)</li>
      <li>JPEG : ベースライン / プログレッシブ (ハフマン)、間引き、リスタート。算術符号・12bit・CMYK は非対応。書き出しはベースライン (品質 / 4:2:0 か 4:4:4)。EXIF の向きは見ない</li>
      <li>BMP : 1/4/8/16/24/32bit・RLE4/8・BITFIELDS・上下逆。書き出しは 24bit / 32bit (V4 ヘッダー)</li>
      <li>TGA : 種類 1/2/3/9/10/11・15/16/24/32bit・原点。書き出しは 24 / 32bit (RLE を選べる)</li>
    </ul></li>
  <li><code>Processing.ImageOperation</code> : 1 つの処理 (<code>Apply(src, dst, ctx)</code>、<code>Enabled</code>、<code>Amount</code> = 元と混ぜる量)。JSON に書ける (種類は "type")。ピクセルの単位の値は元の画像のピクセルで持ち、縮めたプレビューでは <code>ProcessContext.Scale</code> を掛ける
    <ul>
      <li>色 : Grayscale (Y = R*0.30 + G*0.59 + B*0.11) / ChannelScale (R・G・B のどれかだけ) / Posterize / Solarize / Invert / Sepia / Gamma</li>
      <li>画像処理 : GaussianBlur / Sharpen (アンシャープマスク) / Sobel / Emboss / Mosaic / ChromaticAberration</li>
      <li>周波数 : FrequencyFilter (RGB を FFT → 中央の黒丸 = ハイパス、Invert = ローパス。半径は元の画像のナイキストに対する割合)。<code>Fft2D.Spectrum</code> でスペクトルの画像</li>
      <li>トーン : ToneCurve (RGB 共通 + R/G/B。単調 3 次補間 Fritsch-Carlson)</li>
      <li>法線 : NormalMap (輝度を高さとして法線マップ。DirectX / OpenGL の Y の向き)</li>
    </ul></li>
  <li><code>Processing.ImagePipeline</code> : 処理の並び (非破壊)。<code>Run(source, ctx, cache)</code> は <code>PipelineCache</code> に段ごとの結果を取っておき、変わった処理から後ろだけ計算し直す</li>
</ul>
<pre><code>var image = ImageCodec.Load("in.png").Image;
var pipeline = new ImagePipeline();
pipeline.Operations.Add(new GaussianBlurOperation { Sigma = 2 });
pipeline.Operations.Add(new ToneCurveOperation { Rgb = [new(0, 0), new(0.5f, 0.7f), new(1, 1)] });
ImageCodec.Save("out.jpg", pipeline.Run(image), new ImageSaveOptions { JpegQuality = 90 });</code></pre>
<h3>エディター</h3>
<ul>
  <li>上 : Save (元のファイルへ上書き。原寸で計算し直す) / Save As / Options (JPEG の品質など) / Reset / Undo / Redo、比べ方 (After / Before / Side by side / Split)、色の出し方 (Color / Luminance = 輝度 / Normal = 輝度から作った法線マップ。表示だけ)</li>
  <li>左 : 処理の並び (Add / ON・OFF / Up / Down / Duplicate / Remove)。右 : 選んだ処理の設定 (トーンカーブのグラフ、周波数フィルターのスペクトルと黒丸 (ドラッグで半径)) と結果の輝度のヒストグラム</li>
  <li>計算はバックグラウンド。長い辺が 2048 より大きい画像はプレビューを縮めて計算する (Full res で原寸)。Ctrl+Z / Ctrl+Y / Ctrl+S</li>
  <li>プレビューのテクスチャは結果ごとに作り、古い物は <code>Graphics.ReleaseUITexture</code> で返す (C++ : <code>Renderer_ReleaseUITexture</code>。RenderStart を FRAME_COUNT + 1 回通ってから SRV と実体を解放。GPU を待たない)</li>
  <li>起動時に開く : <code>GameEngine.Editor.exe --open-image Assets/....png</code></li>
</ul>
<p>確認 : <code>--editor-test --editor-test-section imaging</code> / 撮影 <code>--editor-test-section imaging-view</code> (環境変数 <code>IMAGING_VIEW_MODE</code> = curve / frequency / normal / luminance)</p>
</article>

<article data-id="profiler" data-title="プロファイラー (v1.10 - v1.13)">
<h2>プロファイラー (v1.10 - v1.13)</h2>
<p>エディターの View &gt; Analysis に 5 つの窓 : <b>Profiler</b> (概要。F1) / <b>CPU Usage</b> / <b>GPU Usage</b> / <b>Rendering Stats</b> / <b>Memory</b>。どれもエディターの ImGui で描く (<code>GameEngine.Editor/ProfilerWindows.cs</code>)。</p>
<ul>
  <li>以前は C++ (RHI.dll) の ImGui の窓 1 つに全部を出していた。ImGui のコンテキストがエディターと別なので、窓の上のクリックが Hierarchy / Scene にもすり抜けていた。エディターではその窓 (F1 のオーバーレイ) を切る : <code>Profiler.SetOverlayEnabled(false)</code> (= <code>Renderer_SetProfilerOverlayEnabled</code>。F1 もメッセージの横取りもしなくなる)。Player は今まで通り F1 で出る</li>
  <li>C++ の計測値は <a href="#/t/GameEngine.Profiler">Profiler</a>.GetFrame (<a href="#/t/GameEngine.ProfilerFrameData">ProfilerFrameData</a> = <code>RHI::ProfilerFrameData</code>、184 byte) / ReadValues / ReadInfos / GpuName で読む。値は <code>ReportProfilerValue</code> で足された順 (名前は増えた時だけ読む)</li>
  <li>窓は値の名前で分ける : <code>GPU…</code> → GPU Usage、<code>Physics…</code> → CPU Usage の Physics、<code>(ms)</code> の付いた物 → CPU Usage、<code>bytes</code> / <code>memory</code> を含む物 → Memory、残り → Rendering Stats</li>
  <li>履歴は 300 フレーム。グラフをクリックするとそのフレームを選んで止める (全部の窓がそのフレームを出す)。Pause / Latest / Clear</li>
</ul>
<h3>CPU の区間</h3>
<ul>
  <li><code>Profiler.BeginSample("名前")</code> 〜 <code>EndSample()</code>、または <code>using (Profiler.Sample("名前")) { }</code>。入れ子にできる。閉じ忘れはフレームの終わりで閉じる</li>
  <li><a href="#/t/GameEngine.Engine">Engine</a>.Run の各段 (Gamepad / Update (game systems) / Animation / Transform / Physics / LateUpdate / UI / Editor GUI / Cameras / Render sync / Skinning / Lights / Render pipeline / Render (native)) と、ゲームの System ごと (型の名前) に区間がある</li>
  <li><code>Profiler.Enabled</code> が false の間は何もしない (CPU Usage の窓が開いている間だけ true)。変えた次のフレームから効く (フレームの途中で切っても、開いた区間は閉じられる)</li>
</ul>
<h3>描画パスの区切りとパスごとの時間 (v1.11)</h3>
<ul>
  <li><code>using (cmd.BeginPass("名前")) { ... }</code> (<a href="#/t/GameEngine.Rendering.RenderCommandBuffer">RenderCommandBuffer</a>.BeginPass / EndPass)。命令の <code>RenderCommandType::BeginPass</code> (11。Arg0 = 名前の番号) / <code>EndPass</code> (12)。描画の結果には影響しない。入れ子にでき、閉じ忘れは C++ がフレームの終わりで閉じる</li>
  <li>名前は <code>Renderer_RegisterPassName</code> で番号にする (C# が名前ごとに 1 回だけ聞いて覚える)</li>
  <li>C++ (<code>RHI/Source/DirectX12/RHIObject/CommandContext_Passes.cpp</code>) : PIX / RenderDoc のイベント (<code>BeginEvent</code> / <code>EndEvent</code>) と C++ の CPU の時間は毎フレーム。GPU のタイムスタンプは <code>Profiler.PassTimingEnabled</code> の間だけ (エディターの GPU Usage の窓が開いている間)。GpuTimer の 10 番から 256 個 (128 パス)、別の範囲で読み戻す</li>
  <li>C++ の中のパス : <code>Skinning (compute)</code> / <code>UI (ImGui / game UI)</code>。組み込みのパイプラインのパス : Camera N / Shadows (Cascade N) / Clear + Sky / Skybox / Opaque / Particles Update / SSAO (SSAO Blur) / Transparent / Particles / Tonemap / FXAA / GBuffer / Deferred Lighting / Forward (custom + transparent) / Preview</li>
  <li>結果は <a href="#/t/GameEngine.Profiler">Profiler</a>.ReadPassTimings (<a href="#/t/GameEngine.PassTimingSample">PassTimingSample</a>。GPU の値は数フレーム前、計っていない時は -1)。エディターは GPU Usage の「Render passes」(行をクリックするとそのパスのグラフ) と CPU Usage の「Render passes (C++ record)」</li>
  <li><a href="#/t/GameEngine.Rendering.RenderTexture">RenderTexture</a>.Create(..., name:) / <code>Name</code> : D3D12 の SetName (PIX / RenderDoc / デバッグレイヤーに出る。画面の大きさで作り直しても付け直す)</li>
</ul>
<h3>Render Graph Viewer (v1.12)</h3>
<ul>
  <li>View &gt; Analysis &gt; Render Graph Viewer (<code>GameEngine.Editor/RenderGraphViewer.cs</code>)。横 = 描画パス、縦 = リソースの格子 : 赤 = 書く / 緑 = 読む / 黄 = 読み書き / C = 消す / R = MSAA の解決 / 斜線 = 深度 / 輪郭の緑 = 命令に無い読み (影) / 橙の三角 = 遷移バリア / 灰色の帯 = 寿命。パスの番号が青 = 前のパスと描画先が同じ (まとめられる候補)</li>
  <li>Live (v1.13.1) : 一定の間隔 (0.25 / 0.5 / 1 / 2 秒) ごとに、その間で一番多くのパスを含むフレームを代表にして、形 (パス / 読み書き / バリア / リソース) が変わった時だけ表を差し替える。影の遠い段を間引くので、フレームごとにパスの数が変わるため (以前は毎フレーム差し替えてチラついた)</li>
  <li>右 : Resource (形式 / 大きさ / メモリ / 寿命 / 中身の絵 (フレームの終わり) / 使われ方とバリアの状態の移り変わり)、Pass (親のパス / 時間 / 読み書きしたリソース)、Passes、Warnings (書いたのに読まれない / 書く前に読む = 前のフレームの中身)</li>
  <li>C++ (<code>CommandContext_Passes.cpp</code>) が <a href="#/t/GameEngine.RenderGraphCapture">RenderGraphCapture</a>.Capture の間だけ記録する (Render Graph Viewer か Memory の窓が開いている間)。記録 : 描画先への描画 / 消す / 全画面シェーダーの入力 / 深度 (書く・比べる) / MSAA の解決 / 影のシャドーマップ (命令に無い読み) / <code>makeTransitionBarrier</code> を通る遷移バリア。バッファ (カリング / スキニング / パーティクル) のバリアは記録しない</li>
  <li>C# : <code>RenderGraphCapture.Read()</code> → <a href="#/t/GameEngine.RenderGraphSnapshot">RenderGraphSnapshot</a> (Passes / Resources / Accesses)。中身の絵は <code>SetPreviewTarget</code> (C++ が UI の前に PIXEL_SHADER_RESOURCE にする。深度 / 配列は出せない)</li>
  <li>エンジンは自動のバリア / パスの削除 / メモリの使い回しをしない。この窓は「実際に実行した命令の列」を見せる物 (Unity の RenderGraph の API とは違う)</li>
  <li>Memory の窓の「Render targets」 : レンダーターゲットごとの GPU のメモリ (<code>GetResourceAllocationInfo</code>。MSAA の写しも含む)</li>
</ul>
<h3>Frame Debugger (v1.13)</h3>
<ul>
  <li>View &gt; Analysis &gt; Frame Debugger (<code>GameEngine.Editor/FrameDebuggerWindow.cs</code>)。Enable で、1 フレームの描画をイベントに分けて止める : 消す (色 / 深度) / シーンの描画 1 回 (メッシュ × マテリアル。インスタンシングならまとめた数) / 全画面 / パーティクルの更新・描画 / 自分のシェーダーの 1 個 / プレビュー</li>
  <li>左 : 描画パスごとのイベントの一覧。スライダー / ◀ ▶ / ← → で動かす。右 : 止めた時の描画先 (RT 0〜3 / Depth、R G B A、Levels)、詳細 (パス / 描画先 / シーンのパス・列・描き方 / 三角形とインスタンスの数 / 物 (クリックで Hierarchy で選ぶ) / マテリアル / 全画面シェーダーの名前・入力・g_Params)</li>
  <li>仕組み (<code>CommandContext_FrameDebug.cpp</code>) : 毎フレーム同じフレームを描き直し、StopEvent のイベントまで描いたら、その時の描画先を <code>frameDebug.shader</code> の PSFrameDebugView で確認用の絵へ写して、残りの描画を飛ばす (UI と後片付けは続ける)。イベントの一覧は止めずに描いたフレームで取る (<code>FrameDebugger.StopEvent = -1</code>)</li>
  <li>Enable の間 : ExecuteIndirect / GPU カリング / オクルージョンを使わず 1 個ずつ描く (描画ごとに止めるため)、影の遠い段の間引きをしない (フレームごとにイベントの並びが変わらないように)、再生中なら一時停止する</li>
  <li>写せない物 : 画面 (Player のバックバッファ) と深度の配列 (シャドーマップ)。シーンビューは止めている間、最後まで描いたフレームの絵のまま</li>
  <li>C# : <a href="#/t/GameEngine.FrameDebugger">FrameDebugger</a> (Enabled / StopEvent / Slot / ChannelMask / Levels / Apply / Read / FindEntity)、<a href="#/t/GameEngine.FrameDebugSnapshot">FrameDebugSnapshot</a></li>
</ul>
</article>

<article data-id="test" data-title="テストを書く">
<h2>テストを書く</h2>
<p><a href="#/t/GameEngine.Editor.EditorTest">EditorTest</a> はフレームを進めるコルーチン。<code>yield return 0</code> で 1 フレーム進み、<code>check(条件, "説明")</code> が PASS / FAIL を出す。</p>
<pre><code>var cube = _app.CreatePrimitive(PrimitiveShape.Cube, Entity.Null);
_app.AssignMaterial(cube, database.Find(material.Path)!);
for (int i = 0; i &lt; 3; i++) yield return 0;             // 描画まで進める
check(_app.Engine.Graphics.CustomDrawCount == 1, $"drawn with the shader ({_app.Engine.Graphics.CustomDrawCount})");</code></pre>
<ul>
  <li>テストで作るファイルは <code>Assets/_DeterminismTest</code> に置く (最後に消える。書き出したゲームに入るシーンもここ)</li>
  <li>書き出し (GameBuilder) → 書き出したゲームを起動 → 同じシーンをエディターで再生、120 フレーム後の状態を比べる (決まった時間刻み)</li>
  <li>説明に測った値を入れる (例 : 時間 / 数)。Release と Debug (D3D12 の検証) の両方で通す</li>
</ul>
</article>

<article data-id="rules" data-title="決まり (コードとログ)">

</ul>

<script>

const DATA = /*__DATA__*/null;

<script>
(() => {
"use strict";
const D = DATA || { generated: "", commit: "", branch: "", modules: [], types: [], exports: [] };
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const enc = s => encodeURIComponent(s);
const KIND_LETTER = { class: "C", struct: "S", interface: "I", enum: "E", record: "R", "record struct": "R", union: "U" };
const kindCls = k => "k-" + (k.startsWith("record") ? "record" : k);
const kindBadge = t => `<span class="kind ${kindCls(t.kind)}" title="${esc(t.kind)}">${KIND_LETTER[t.kind] || "?"}</span>`;
const langPill = l => `<span class="pill ${l === "C#" ? "lang-cs" : "lang-cpp"}">${esc(l)}</span>`;
const MOD = new Map(D.modules.map(m => [m.id, m]));
const T = new Map(D.types.map(t => [t.id, t]));

// ---------- 名前 → 型 (継承 / 使う関係 / シグネチャのリンク) ----------
const arityOf = id => { const m = id.match(/<(,*)>$/); return m ? m[1].length + 1 : 0; };
const byName = new Map();
for (const t of D.types) {
  t.derived = []; t.usedBy = []; t.baseRefs = []; t.baseText = [];
  const key = t.lang + "|" + t.name + "|" + arityOf(t.id);
  if (!byName.has(key)) byName.set(key, []);
  byName.get(key).push(t);
}
function splitTop(s) { const out = []; let d = 0, cur = ""; for (const ch of s) { if (ch === "<") d++; if (ch === ">") d--; if (ch === "," && d === 0) { out.push(cur); cur = ""; } else cur += ch; } if (cur.trim()) out.push(cur); return out; }
function resolve(name, from) {
  let n = name.trim().replace(/^global::/, "").replace(/\?$/, "");
  let arity = 0;
  const g = n.match(/^([^<]+)<(.*)>$/);
  if (g) { arity = splitTop(g[2]).length; n = g[1]; }
  const last = n.split(/\.|::/).pop().trim();
  const list = byName.get(from.lang + "|" + last + "|" + arity) || [];
  if (!list.length) return null;
  return list.find(t => t.module === from.module && t.ns === from.ns) || list.find(t => t.module === from.module) || list.find(t => from.ns && t.ns && from.ns.startsWith(t.ns)) || list[0];
}
for (const t of D.types) {
  for (const b of t.bases) { const r = resolve(b, t); if (r && r !== t) { t.baseRefs.push(r.id); r.derived.push(t.id); } else t.baseText.push(b); }
  for (const u of t.uses || []) { const o = T.get(u); if (o) o.usedBy.push(t.id); }
}
const groupOf = t => { const m = MOD.get(t.module); const rel = t.file.startsWith(m.path + "/") ? t.file.slice(m.path.length + 1) : t.file; const i = rel.lastIndexOf("/"); return i < 0 ? "(直下)" : rel.slice(0, i); };
for (const t of D.types) t.group = groupOf(t);
const typeLink = (t, label) => `<a href="#/t/${enc(t.id)}">${esc(label ?? displayName(t))}</a>`;
const displayName = t => t.name + (t.generic || "");
const qualified = t => (t.parent && T.get(t.parent) ? displayName(T.get(t.parent)) + (t.lang === "C#" ? "." : "::") : "") + displayName(t);

function linkSig(sig, t, self) {
  // 識別子ごとに切って、知っている型だけリンクにする (先に切るので &lt; の中の文字は触らない)
  return sig.split(/([A-Za-z_]\w*)/).map((part, i) => {
    if (i % 2 === 0) return esc(part);
    if (part === self) return `<b>${esc(part)}</b>`;
    const r = /^[A-Z]/.test(part) ? resolve(part, t) : null;
    return r ? `<a href="#/t/${enc(r.id)}">${esc(part)}</a>` : esc(part);
  }).join("");
}

// ---------- 文字の幅 (図の箱の大きさ) ----------
const canvas = document.createElement("canvas").getContext("2d");
const textWidth = (s, font) => { canvas.font = font; return canvas.measureText(s).width; };
const FONT_NAME = "600 13px Segoe UI, sans-serif", FONT_MEMBER = "11px Consolas, monospace";

// ==========================================================================
// 目次
// ==========================================================================
const GUIDES = [...$("#guides").content.querySelectorAll("article")].map(a => ({ id: a.dataset.id, title: a.dataset.title, node: a }));
function buildNav() {
  $("#meta").textContent = D.generated ? `${D.generated} 生成 / ${D.branch} ${D.commit.split(" ")[0] || ""}` : "make_reference.py で作ってください";
  const visible = t => !t.parent && t.kind !== "enum";
  let h = `<div class="sec">はじめに</div>
    <a class="item" href="#/">概要と構成図</a>
    <a class="item" href="#/hier">継承の木</a>
    <a class="item" href="#/native">C# ↔ C++ の境界</a>
    <div class="sec">開発ガイド</div>` + GUIDES.map(g => `<a class="item" href="#/g/${g.id}">${esc(g.title)}</a>`).join("");
  for (const lang of ["C#", "C++"]) {
    h += `<div class="sec">${lang === "C#" ? "C# のモジュール" : "C++ のモジュール"}</div>`;
    for (const m of D.modules.filter(m => m.lang === lang)) {
      const types = D.types.filter(t => t.module === m.id);
      const groups = [...new Set(types.map(t => t.group))].sort();
      h += `<details data-mod="${m.id}"><summary><a href="#/m/${m.id}" style="color:inherit">${esc(m.name)}</a><span class="count">${types.length}</span></summary><div>`;
      for (const g of groups) {
        const list = types.filter(t => t.group === g && visible(t)).sort((a, b) => a.name.localeCompare(b.name));
        if (!list.length) continue;
        h += groups.length > 1 ? `<details><summary>${esc(g)}<span class="count">${list.length}</span></summary><div>` : "";
        h += list.map(t => `<a class="item" href="#/t/${enc(t.id)}">${kindBadge(t)}${esc(displayName(t))}</a>`).join("");
        h += groups.length > 1 ? `</div></details>` : "";
      }
      h += `</div></details>`;
    }
  }
  $("#nav").innerHTML = h;
}

// ==========================================================================
// 図 : 箱 / 線 / 拡大と移動
// ==========================================================================
function memberRows(t, max) {
  const order = ["constructor", "property", "field", "constant", "event", "method", "value"];
  const rows = t.members.filter(m => m.access !== "private" && order.includes(m.kind) && m.kind !== "constructor")
    .sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind));
  const icon = m => ({ property: "◆", field: "●", constant: "■", event: "⚡", method: "ƒ", value: "·" }[m.kind] || "·");
  const label = m => {
    if (m.kind === "method") return `${icon(m)} ${m.name}()`;
    if (m.kind === "value") return `· ${m.name}`;
    const type = m.sig.replace(/\{.*$/, "").replace(/\b(static|readonly|const|virtual|override|abstract|required|volatile|event|mutable|constexpr|inline)\b/g, "").trim();

// 継承の線 : 子の上 → 親の下 (直角に曲げる)。親が interface なら破線 (実装)
function inheritEdge(child, parent) {
  const x1 = child.x + child.w / 2, y1 = child.y, x2 = parent.x + parent.w / 2, y2 = parent.y + parent.h;
  const impl = parent.t.kind === "interface" ? " impl" : "";

  const sx = left ? a.x : ax, ex = left ? b.x + b.w : bx;
  const dx = Math.max(40, Math.abs(ex - sx) / 2) * (left ? -1 : 1);
  const ang = left ? 0 : Math.PI;
  const arrow = `M${ex},${by} l${Math.cos(ang + .45) * 9},${Math.sin(ang + .45) * 9} M${ex},${by} l${Math.cos(ang - .45) * 9},${Math.sin(ang - .45) * 9}`;
  return `<path class="edge use" d="M${sx},${ay} C${sx + dx},${ay} ${ex - dx},${by} ${ex},${by}"/><path class="edge" d="${arrow}" style="stroke:var(--d-use)"/>`;

function mountDiagram(host, inner, width, height, opts = {}) {
  host.classList.toggle("short", !!opts.short);
  if (opts.short) { host.innerHTML = `<svg width="100%" viewBox="0 0 ${width} ${height}" style="max-height:${opts.maxHeight || 520}px">${inner}</svg>`; wireNodes(host); return; }
  host.innerHTML = `<svg width="100%" height="100%"><g class="vp">${inner}</g></svg><div class="zoom"><button data-z="in">＋</button><button data-z="out">−</button><button data-z="fit">全体</button></div>`;
  const svg = host.querySelector("svg"), vp = host.querySelector(".vp");
  let s = 1, tx = 0, ty = 0;
  const apply = () => vp.setAttribute("transform", `translate(${tx},${ty}) scale(${s})`);
  const fit = () => { const r = host.getBoundingClientRect(); s = Math.min(1.1, (r.width - 30) / width, (r.height - 30) / height); tx = (r.width - width * s) / 2; ty = 15; apply(); };
  const zoomAt = (f, cx, cy) => { const ns = Math.min(3, Math.max(.08, s * f)); tx = cx - (cx - tx) * ns / s; ty = cy - (cy - ty) * ns / s; s = ns; apply(); };

  host.addEventListener("wheel", e => { e.preventDefault(); const r = host.getBoundingClientRect(); zoomAt(Math.pow(1.0015, -e.deltaY), e.clientX - r.left, e.clientY - r.top); }, { passive: false });

  host.addEventListener("pointerdown", e => { if (e.target.closest(".zoom")) return; drag = { x: e.clientX, y: e.clientY, tx, ty, moved: false }; host.setPointerCapture(e.pointerId); host.style.cursor = "grabbing"; });
  host.addEventListener("pointermove", e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; tx = drag.tx + dx; ty = drag.ty + dy; apply(); });
  host.addEventListener("pointerup", e => { host.style.cursor = ""; const d = drag; drag = null; if (d && !d.moved) { const n = document.elementFromPoint(e.clientX, e.clientY)?.closest(".node"); if (n) location.hash = "#/t/" + enc(n.dataset.id); } });
  host.querySelector(".zoom").addEventListener("click", e => { const z = e.target.dataset.z; const r = host.getBoundingClientRect(); if (z === "fit") fit(); else zoomAt(z === "in" ? 1.25 : .8, r.width / 2, r.height / 2); });
}
